<script id="allpa-resoluciones-v5-script">
(function(){
'use strict';
const VERSION='8.0.0-resoluciones-obra-mayor-v7-interfaz';
const SUPABASE_URL='https://lfinvpmobnczgtabtwfs.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_oARH0ZQa0_d8w_dkYYd1dw_NlWSUn9i';
let TEMPLATE_ROWS=[];
let TEMPLATE_META={version:'',sha256:'',url:'../data/plantillas/resolucion_obra_mayor.csv'};
let templateReady=false;
const OPTIONAL_VARS=new Set(['TIPO_OBRA_RESUELVE_FRAGMENTO','TIPO_OBRA_ARTICULO_FRAGMENTO']);
const STRUCT_TECH_URL='../data/tecnicos_estructurales.csv';
const INSTITUTIONAL_BG='../assets/fondo_institucional.png';
let STRUCT_TECH_ROWS=[];
let structTechReady=false;
let client=null,user=null,profile=null,reports=[],selected=null,resolution=null,lastPreview=null,busy=false,demoMode=false;

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function clone(v){try{return JSON.parse(JSON.stringify(v));}catch(_){return null;}}
function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toUpperCase();}
function todayLocal(){const d=new Date();const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function longDate(v){if(!v)return '';const p=String(v).slice(0,10).split('-').map(Number);if(p.length!==3||!p[0]||!p[1]||!p[2])return String(v);const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return `${String(p[2]).padStart(2,'0')} de ${months[p[1]-1]||''} de ${p[0]}`;}
function money(v){const n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):String(v||'');}
function cfg(key){return String(TEMPLATE_ROWS.find(r=>r.ID_Bloque===key)?.Texto_Base||'').trim();}
function getEl(id){return document.getElementById(id);}
function setStatus(msg,type='info'){const el=getEl('rv5Status');if(!el)return;el.textContent=msg;el.className='rv5-status '+(type==='info'?'':type);}
function role(){return String(profile?.rol||'').toUpperCase();}
function canWrite(){return !!profile?.activo && ['ABOGADA','ADMIN'].includes(role());}
function canRead(){return !!profile?.activo && ['ABOGADA','ADMIN','DIRECCION'].includes(role());}
function setBusy(v){busy=!!v;document.querySelectorAll('[data-rv5-write]').forEach(b=>b.disabled=busy||!canWrite()||resolution?.estado==='FINALIZADA'||demoMode);}
function parseCsvSemicolon(text){
  const rows=[];let row=[],field='',quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else quoted=false;}else field+=c;continue;}
    if(c==='"'){quoted=true;continue;}
    if(c===';'){row.push(field);field='';continue;}
    if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field='';continue;}
    field+=c;
  }
  if(field!==''||row.length){row.push(field.replace(/\r$/,''));rows.push(row);}
  if(!rows.length)return [];
  const headers=rows.shift().map((h,i)=>String(h||'').replace(/^\ufeff/,'').trim());
  return rows.filter(r=>r.some(x=>String(x||'').trim()!=='')).map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]??'')])));
}

async function loadStructuralTechnicians(){
  try{
    const url=new URL(STRUCT_TECH_URL,window.location.href).href;
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error('No se pudo cargar técnicos estructurales ('+res.status+').');
    STRUCT_TECH_ROWS=parseCsvSemicolon(await res.text());
    structTechReady=STRUCT_TECH_ROWS.length>0;
    return STRUCT_TECH_ROWS;
  }catch(err){
    STRUCT_TECH_ROWS=[];structTechReady=false;
    console.warn('ALLPA Resoluciones V4 - técnicos estructurales:',err);
    return [];
  }
}
function cleanMemoNumber(v){

async function saveDraft(silent=false){if(!templateReady)throw new Error('La plantilla CSV de Resolución no está cargada.');if(demoMode)throw new Error('El modo demostración no guarda datos.');if(!canWrite())throw new Error('Su perfil no puede guardar Resoluciones.');if(!selected?.informe_id)throw new Error('Seleccione un Informe Técnico.');saveExtra();const payload=legalPayload();setBusy(true);if(!silent)setStatus('Guardando borrador de Resolución…');try{const data=await rpc('phdu_guardar_borrador_resolucion',{p_payload:payload});const row=Array.isArray(data)?data[0]:data;if(!row?.resolucion_id)throw new Error('Supabase no devolvió el identificador del borrador.');resolution={...(resolution||{}),id:row.resolucion_id,estado:row.estado,fecha_resolucion:row.fecha_resolucion,numero_memorando_remision:row.numero_memorando_remision,fecha_memorando_remision:row.fecha_memorando_remision,numero_comprobante:row.numero_comprobante,fecha_comprobante:row.fecha_comprobante,valor_comprobante:row.valor_comprobante,concepto_comprobante:row.concepto_comprobante,correo_notificacion:row.correo_notificacion,correo_notificacion_pertenece_a:payload.correo_notificacion_pertenece_a};if(!silent)setStatus((row.creado_nuevo?'Borrador creado':'Borrador actualizado')+' correctamente. No se asignó ningún número.','ok');await loadReports();renderWorkspace();return row;}catch(err){if(!silent)setStatus('No se pudo guardar el borrador: '+String(err?.message||err),'error');throw err;}finally{setBusy(false);}}

');await loadReports();renderWorkspace();}catch(err){setStatus('No se pudo finalizar la Resolución: '+String(err?.message||err),'error');}finally{setBusy(false);}}
