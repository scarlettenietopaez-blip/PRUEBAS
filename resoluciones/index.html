ROPIETARIO|PROPIETARIO_NOMBRE|PROPIETARIO_CEDULA","Fuente_Datos":"CFG_003|CFG_004|Informe: egob, fechaIngresoTramite, proyectista, propietario","Mostrar":"SI","Observacion_Interna":"La fecha de ingreso proviene del nuevo campo state.fechaIngresoTramite."},{"ID_Bloque":"CON_001","Orden":"30","Pagina_Referencia":"1","Seccion":"CONSIDERANDOS","Titulo":"CONSTITUCION_ART_30","Texto_Base":"Que, el artículo 30 de la Constitución de la República señala que “las personas tienen derecho a un hábitat seguro y saludable, y a una vivienda adecuada y digna, con independencia de su situación social y económica”. (Énfasis añadido);","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_002","Orden":"31","Pagina_Referencia":"1","Seccion":"CONSIDERANDOS","Titulo":"CONSTITUCION_ART_31","Texto_Base":"Que, el artículo 31 de la Constitución de la República dispone: “Las personas tienen derecho al disfrute pleno de la ciudad y de sus espacios públicos, bajo los principios de sustentabilidad, justicia social, respeto a las diferentes culturas urbanas y equilibrio entre lo urbano y lo rural. El ejercicio del derecho a la ciudad se basa en la gestión democrática de ésta, en la función social y ambiental de la propiedad y de la ciudad, y en el ejercicio pleno de la ciudadanía.”;","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_003","Orden":"32","Pagina_Referencia":"1","Seccion":"CONSIDERANDOS","Titulo":"CONSTITUCION_ART_66_321","Texto_Base":"Que, el numeral 2 del artículo 66 de la Carta Magna reconoce y garantiza a las personas el derecho a una vida digna que asegure la vivienda y otros servicios sociales necesarios; en armonía con el numeral 26 del artículo 66 del mismo cuerpo normativo, concordante con el artículo 321 de la Constitución de la República garantizan a las personas el derecho a la propiedad en todas sus formas, con función y responsabilidad social y ambiental. (Énfasis añadido);","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_004","Orden":"33","Pagina_Referencia":"1","Seccion":"CONSIDERANDOS","Titulo":"CONSTITUCION_ART_264_COOTAD","Texto_Base":"Que, el artículo 264 numerales 1 y 2 de la Carta Magna, en concordancia con los artículos 54 letra e); y, c); y el artículo 55 letras a) y b) Código Orgánico de Organización Territorial Autonomía y Descentralización, establecen que los gobiernos municipales tendrán, entre otras competencias exclusivas, la de planificar el desarrollo cantonal y formular los correspondientes planes de ordenamiento territorial, de manera articulada con la planificación nacional, regional, provincial y parroquial, con el fin de regular el uso y la ocupación del suelo urbano y rural; y, la de ejercer el control sobre el uso y ocupación del suelo en el cantón; además de establecer el régimen de uso del suelo y urbanístico, para lo cual determinará las condiciones de urbanización, parcelación, lotización, división o cualquier otra forma de fraccionamiento de conformidad con la planificación cantonal, asegurando porcentajes para zonas verdes y áreas comunales;","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_005","Orden":"34","Pagina_Referencia":"1","Seccion":"CONSIDERANDOS","Titulo":"COOTAD_ART_54_O","Texto_Base":"Que, la letra o) del artículo 54 del Código Orgánico de Organización Territorial Autonomía y Descentralización establece que una de las funciones del gobierno autónomo descentralizado municipal es “Regular y controlar las construcciones en la circunscripción cantonal, con especial atención a las normas de control y prevención de riesgos y desastres”. (Énfasis añadido);","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_006","Orden":"35","Pagina_Referencia":"2","Seccion":"CONSIDERANDOS","Titulo":"LOOTUGS_ART_80","Texto_Base":"Que, el artículo 80 de la Ley Orgánica de Ordenamiento Territorial Uso y Gestión de Suelo manifiesta: “Del control de la habitabilidad. Mientras dure la construcción, los gobiernos autónomos descentralizados municipales o metropolitanos deberán ejercer el control respecto de la habitabilidad de la edificación. El incumplimiento de esta obligación no exime al gobierno correspondiente de verificar que la obra terminada cumple con las normas aplicables, ni de disponer las medidas a que haya lugar de verificarse incumplimientos” (Énfasis añadido);","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_007","Orden":"36","Pagina_Referencia":"2","Seccion":"CONSIDERANDOS","Titulo":"LOOTUGS_ART_91","Texto_Base":"Que, los números 1, 2 y 6 artículo 91 de la Ley ibidem dice: “Atribuciones y Obligaciones de los Gobiernos Autónomos Descentralizados municipales y metropolitanos para el uso y la gestión del suelo. A los Gobiernos Autónomos Descentralizados municipales y metropolitanos, sin perjuicio de las competencias y facultades establecidas en la Constitución y la ley, les corresponden las siguientes atribuciones y obligaciones: 1) Expedir actos administrativos y normativos para el uso y la gestión del suelo, de conformidad con los principios y mecanismos previstos en el planeamiento urbanístico de su circunscripción territorial y la normativa vigente; 2) Aplicar los instrumentos de planeamiento urbanístico y las herramientas de gestión del suelo de forma concordante y articulada con los planes de desarrollo y ordenamiento territorial. Y 6) Emitir los permisos y autorizaciones para la habilitación e intervención del suelo y la construcción, de acuerdo con lo dispuesto por esta Ley, la normativa vigente y la planificación urbanística aplicable.” (Énfasis añadido);","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_008","Orden":"37","Pagina_Referencia":"2","Seccion":"CONSIDERANDOS","Titulo":"ORDENANZA_ART_76","Texto_Base":"Que, el Art. 76 de la Ordenanza Municipal N.º 016-2023 que Contiene la Actualización del Código Urbano publicada en la Edición Especial del Registro Oficial N.º 885 el 23 de mayo de 2023, indica: respecto de los Actos sujetos a la Licencia, Autorización o Aprobación Urbanística de Edificación (…) “Obras mayores, que por su naturaleza y especialización precisan para su definición de un Proyecto Técnico y que se refieren a edificaciones nuevas, que comprenden obras de reconstrucción, sustitución o ampliación”. (Énfasis añadido);","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_009","Orden":"38","Pagina_Referencia":"2","Seccion":"CONSIDERANDOS","Titulo":"ORDENANZA_ART_92","Texto_Base":"Que, el Art. 92 de la Ordenanza en análisis, indica: “De las Obras Mayores. - Son los procesos constructivos que por su naturaleza y especialización precisan para la obtención de Licencia Urbanística de edificación la presentación de un Proyecto Técnico, que merece un proceso de revisión por parte de la Autoridad Municipal”. (Énfasis añadido);","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_010","Orden":"39","Pagina_Referencia":"2","Seccion":"CONSIDERANDOS","Titulo":"ORDENANZA_ART_93","Texto_Base":"Que, el Art. 93 de la Ordenanza ibidem, “Las solicitudes de Licencia Urbanística de Edificación de Obras Mayores se tramitarán mediante procedimiento general. En el caso de propuestas de edificación de hasta dos pisos o 400 m2 la aprobación del anteproyecto de edificación será opcional, pudiendo solicitar el administrado directamente el otorgamiento de la Licencia Urbanística de Edificación de Obra Mayor”. (Énfasis añadido);","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_011","Orden":"40","Pagina_Referencia":"2","Seccion":"CONSIDERANDOS","Titulo":"ORDENANZA_ART_94","Texto_Base":"Que, el Art. 94 de la Ordenanza Municipal N.º 016-2023 que contiene la Actualización del Código Urbano publicada en la Edición Especial del Registro Oficial N.º 885 del 23 de mayo de 2023, determina los Requisitos para el Otorgamiento de la Licencia Urbanística de Edificación de Obras Mayores, siendo estos los requisitos generales y complementarios;","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_012","Orden":"41","Pagina_Referencia":"2","Seccion":"CONSIDERANDOS","Titulo":"ORDENANZA_ART_95","Texto_Base":"Que, el Art. 95 de la Ordenanza ibidem, establece el Contenido del Proyecto Técnico de Edificación de Obras Mayores, el cual deberá ser suscrito por el propietario del predio, el promotor en caso de que corresponda y los profesionales técnicos respectivos. “En el caso que el Proyecto de Edificación de Obra Mayor se desee declarar bajo régimen de propiedad horizontal, está deberá proyectarse conforme a lo establecido en las Normas de Arquitectura y Construcción, en la sección referente a propiedad horizontal. (Énfasis añadido);","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_013","Orden":"42","Pagina_Referencia":"2","Seccion":"CONSIDERANDOS","Titulo":"ORDENANZA_ART_746_747","Texto_Base":"Que, el Art. 746 y art 747 de la Ordenanza Municipal No. 016-2023 que contiene la Actualización del Código Urbano del cantón Riobamba establece las Infracciones graves en edificación e Infracciones leves en edificación;","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_014","Orden":"43","Pagina_Referencia":"3","Seccion":"CONSIDERANDOS","Titulo":"CRITERIO_JURIDICO","Texto_Base":"Que, el Memorando Nro. {{MEMORANDO_CRITERIO_JURIDICO}}, contiene el criterio jurídico, mediante el cual se determina: “{{TEXTO_CRITERIO_JURIDICO}}”.","Tipo_Bloque":"DINAMICO_CONFIG","Variables":"MEMORANDO_CRITERIO_JURIDICO|TEXTO_CRITERIO_JURIDICO","Fuente_Datos":"CFG_006|CFG_007","Mostrar":"SI","Observacion_Interna":"Permite cambiar el memorando o su texto sin tocar el index."},{"ID_Bloque":"CON_015","Orden":"44","Pagina_Referencia":"3","Seccion":"CONSIDERANDOS","Titulo":"CERTIFICADO_GRAVAMEN","Texto_Base":"Que, del certificado de gravamen {{CERTIFICADO_GRAVAMEN}} y Ficha Registral Nro. {{FICHA_REGISTRAL}}, de fecha {{FECHA_GRAVAMEN_LARGA}}, firmado electrónicamente por {{REGISTRADOR_PROPIEDAD}}, Registrador de la Propiedad del Cantón Riobamba, se desprende que {{TRATAMIENTO_PROPIETARIO}} {{PROPIETARIO_NOMBRE}}, con número de cédula {{PROPIETARIO_CEDULA}}, es {{CALIDAD_PROPIETARIO}} del bien inmueble situado en la parroquia {{PARROQUIA}} del cantón Riobamba, con un Área Total de {{AREA_TOTAL_CERTIFICADO_LETRAS}} ({{AREA_TOTAL_CERTIFICADO}} m2).","Tipo_Bloque":"DINAMICO","Variables":"CERTIFICADO_GRAVAMEN|FICHA_REGISTRAL|FECHA_GRAVAMEN_LARGA|REGISTRADOR_PROPIEDAD|TRATAMIENTO_PROPIETARIO|PROPIETARIO_NOMBRE|PROPIETARIO_CEDULA|CALIDAD_PROPIETARIO|PARROQUIA|AREA_TOTAL_CERTIFICADO_LETRAS|AREA_TOTAL_CERTIFICADO","Fuente_Datos":"Informe: requisito REQ_027 detalle + propietario + ubicación; CFG_005. Área: state.requisitos[REQ_GRAVAMEN].detalle.areaTotalCertificado","Mostrar":"SI","Observacion_Interna":"REGISTRADOR_PROPIEDAD queda centralizado en CFG_005."},{"ID_Bloque":"CON_016","Orden":"45","Pagina_Referencia":"3","Seccion":"CONSIDERANDOS","Titulo":"CRITERIO_ESTRUCTURAL","Texto_Base":"Que, con Memorando Nro. {{DOCUMENTO_ESTRUCTURAL}}, de {{FECHA_DOCUMENTO_ESTRUCTURAL_LARGA}}, suscrito por {{TECNICO_ESTRUCTURAL}}, {{CARGO_TECNICO_ESTRUCTURAL}}, del que se desprende en la parte pertinente a las conclusiones: “Una vez realizada la revisión estructural solicitada, se emite CRITERIO TÉCNICO {{CRITERIO_ESTRUCTURAL}}, en lo referente al Cálculo y diseño estructural bajo firma de responsabilidad del Ingeniero Calculista. {{ING_CALCULISTA}}, Registro Senescyt {{REG_SENESCYT_CALCULISTA}}. (…)”;","Tipo_Bloque":"DINAMICO","Variables":"DOCUMENTO_ESTRUCTURAL|FECHA_DOCUMENTO_ESTRUCTURAL_LARGA|TECNICO_ESTRUCTURAL|CARGO_TECNICO_ESTRUCTURAL|CRITERIO_ESTRUCTURAL|ING_CALCULISTA|REG_SENESCYT_CALCULISTA","Fuente_Datos":"Informe: state.aprobatorio.estructural.documento|fecha|tecnico|criterio|calculista|senescyt","Mostrar":"SI","Observacion_Interna":"FECHA_DOCUMENTO_ESTRUCTURAL proviene del nuevo state.aprobatorio.estructural.fecha."},{"ID_Bloque":"CON_017","Orden":"46","Pagina_Referencia":"3","Seccion":"CONSIDERANDOS","Titulo":"CONCLUSION_TECNICA_MEMORANDO","Texto_Base":"Que, mediante Memorando Nro. {{NUMERO_MEMORANDO_REMISION}}, de fecha {{FECHA_MEMORANDO_REMISION_LARGA}}, suscrito por {{TECNICO_INFORME}}, {{CARGO_TECNICO_INFORME}}, se desprende en la parte pertinente a las conclusiones: “{{CONCLUSION_TECNICA_INFORME}}”. Cabe indicar que el Proyecto Arquitectónico tiene un área a construir de {{AREA_CONSTRUCCION}} m2, superficie correspondiente al pago de la tasa administrativa; (Énfasis añadido);","Tipo_Bloque":"DINAMICO_ABOGADA","Variables":"NUMERO_MEMORANDO_REMISION|FECHA_MEMORANDO_REMISION_LARGA|TECNICO_INFORME|CARGO_TECNICO_INFORME|CONCLUSION_TECNICA_INFORME|AREA_CONSTRUCCION","Fuente_Datos":"phdu_resoluciones: numero_memorando_remision, fecha_memorando_remision; Informe Técnico Aprobatorio: técnico, cargo, conclusión técnica y área de construcción","Mostrar":"SI","Observacion_Interna":"El número y la fecha del Memorando de remisión son registrados posteriormente por la ABOGADA porque se generan en eGOB. El resto del párrafo se completa automáticamente desde el Informe Técnico Aprobatorio."},{"ID_Bloque":"CON_018","Orden":"47","Pagina_Referencia":"3","Seccion":"CONSIDERANDOS","Titulo":"INFORME_TECNICO_APROBATORIO","Texto_Base":"Que, una vez conocido el Informe Técnico Aprobatorio Nro. {{NUMERO_INFORME_APROBATORIO}} de Licencia Urbanística de Obra Mayor, suscrito por {{TECNICO_INFORME}}, {{CARGO_TECNICO_INFORME}}, se autoriza la emisión de cartas por el área de construcción para el pago de la tasa administrativa de acuerdo a la Ordenanza No. 020- 2017 la cual determina el valor y cobro de tasas por servicios administrativos en el Gobierno Autónomo Descentralizado Municipal del Cantón Riobamba, con la finalidad de continuar con el proceso correspondiente.","Tipo_Bloque":"DINAMICO","Variables":"NUMERO_INFORME_APROBATORIO|TECNICO_INFORME|CARGO_TECNICO_INFORME","Fuente_Datos":"phdu_informes_aprobatorios.numero_formateado|tecnico_nombre + phdu_profiles.firma_cargo","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"CON_019","Orden":"48","Pagina_Referencia":"3","Seccion":"CONSIDERANDOS","Titulo":"COMPROBANTE_PAGO","Texto_Base":"Que, se adjuntó el comprobante de pago Nro. {{NUMERO_COMPROBANTE}}, de fecha {{FECHA_COMPROBANTE_LARGA}}, por un valor de ${{VALOR_COMPROBANTE}}, correspondiente a {{CONCEPTO_COMPROBANTE}};","Tipo_Bloque":"DINAMICO_ABOGADA","Variables":"NUMERO_COMPROBANTE|FECHA_COMPROBANTE_LARGA|VALOR_COMPROBANTE|CONCEPTO_COMPROBANTE","Fuente_Datos":"phdu_resoluciones: datos ingresados por la abogada","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"RES_001","Orden":"60","Pagina_Referencia":"3","Seccion":"RESUELVE","Titulo":"PUENTE_RESUELVE","Texto_Base":"Enunciadas las normas y principios jurídicos en que se fundamenta la presente resolución; explicada la pertinencia de su aplicación a los antecedentes de hecho SE RESUELVE:","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"RES_002","Orden":"61","Pagina_Referencia":"3","Seccion":"RESUELVE","Titulo":"OTORGAR","Texto_Base":"OTORGAR LA LICENCIA URBANÍSTICA DE OBRA MAYOR PROYECTO DEFINITIVO, USO {{USO_PROYECTO}}; A FAVOR DE {{TRATAMIENTO_PROPIETARIO_MAYUS}} {{PROPIETARIO_NOMBRE_MAYUS}}; al tenor de las siguientes cláusulas:","Tipo_Bloque":"DINAMICO","Variables":"USO_PROYECTO|TRATAMIENTO_PROPIETARIO_MAYUS|PROPIETARIO_NOMBRE_MAYUS","Fuente_Datos":"Informe Técnico Aprobatorio: uso + propietario","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"ART_001","Orden":"70","Pagina_Referencia":"3-4","Seccion":"ARTICULOS","Titulo":"ARTICULO_1_OTORGAMIENTO","Texto_Base":"Artículo 1.- Otorgamiento. - Una vez procedido con el respectivo pago de aprobación de planos de construcción y por encontrarse de conformidad a los requisitos contenidos en los Artículos 93 y 94 de la Ordenanza Municipal No. 016-2023 que contiene la Actualización del Código Urbano para el Cantón Riobamba, se otorga la LICENCIA URBANÍSTICA DE OBRA MAYOR, PROYECTO DEFINITIVO, uso {{USO_PROYECTO}}, altura de edificación {{PISOS_LETRAS}} ({{PISOS}}) pisos, propiedad de {{TRATAMIENTO_PROPIETARIO}} {{PROPIETARIO_NOMBRE}}, con número de cédula {{PROPIETARIO_CEDULA}}, predio ubicado en la parroquia {{PARROQUIA}}, sector {{SECTOR}}, {{DIRECCION_PREDIO}}, Zona de planeamiento {{ZONA_PLANEAMIENTO}}, clave catastral {{CLAVE_CATASTRAL}}, proyectista {{PROYECTISTA_NOMBRE}}, con registro Senescyt {{PROYECTISTA_SENESCYT}}, registro municipal {{PROYECTISTA_REGISTRO_MUNICIPAL}}.","Tipo_Bloque":"DINAMICO","Variables":"USO_PROYECTO|PISOS_LETRAS|PISOS|TRATAMIENTO_PROPIETARIO|PROPIETARIO_NOMBRE|PROPIETARIO_CEDULA|PARROQUIA|SECTOR|DIRECCION_PREDIO|ZONA_PLANEAMIENTO|CLAVE_CATASTRAL|PROYECTISTA_NOMBRE|PROYECTISTA_SENESCYT|PROYECTISTA_REGISTRO_MUNICIPAL","Fuente_Datos":"Informe Técnico Aprobatorio","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"ART_002","Orden":"71","Pagina_Referencia":"4","Seccion":"ARTICULOS","Titulo":"ARTICULO_2_VIGENCIA","Texto_Base":"Artículo 2.- Vigencia. - El propietario(a) del inmueble tendrá un plazo de 2 años, contados a partir de la notificación con la presente Resolución Administrativa; para dar inicio a las actividades encaminadas a ejecutar la Obra debiendo notificar el inicio de los mencionados actos o actuaciones, en caso de no existir dicha notificación dentro del plazo establecido la Licencia caducará y por ende se entenderá por extinguido el derecho. Una vez notificado el inicio de los actos o actuaciones, la vigencia de la licencia será de tres años.","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"ART_003","Orden":"72","Pagina_Referencia":"4","Seccion":"ARTICULOS","Titulo":"ARTICULO_3_SANCIONES","Texto_Base":"Artículo 3.- Sanciones. - El propietario(a) edificará de conformidad a los planos aprobados y que constituyen habilitantes de la presente Resolución Administrativa; así como también a la Norma Ecuatoriana de Construcción; el incumplimiento a dicha disposición será sancionado de conformidad al Libro V Del Régimen Sancionador determinado en la Ordenanza Municipal N.º 016-2023 que contiene la actualización del Código Urbano publicada en la Edición Especial del Registro Oficial N.º 885 del 23 de mayo de 2023.","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"ART_004","Orden":"73","Pagina_Referencia":"4","Seccion":"ARTICULOS","Titulo":"ARTICULO_4_INICIO_OBRAS","Texto_Base":"Artículo 4.- Inicio de ejecución de obras.- Se recuerda al propietario(a) del inmueble que deberá poner obligatoriamente en conocimiento a la Dirección General de Gestión de Justicia y Control Municipal, conforme a la nueva estructura orgánica institucional, el inicio de la ejecución de obras, por cuanto dicha Dirección constituye la unidad competente para regular y controlar el inicio del proceso constructivo de las edificaciones autorizadas.","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"ART_005","Orden":"74","Pagina_Referencia":"4","Seccion":"ARTICULOS","Titulo":"ARTICULO_5_PRORROGA","Texto_Base":"Artículo 5.- Prórroga. - Los plazos establecidos en las Licencias, podrán prorrogarse a solicitud presentada por el titular antes del vencimiento de su vigencia; en cualquier caso, la prórroga sólo podrá concederse por una sola vez y por un plazo que no sea superior al 50% del inicialmente otorgado. La petición de la persona interesada y la decisión de prórroga o ampliación se producirán antes del vencimiento del plazo. En ningún caso se ampliará un término o plazo ya vencido. La prórroga no supondrá modificación alguna de la Licencia, Autorización o Aprobación Urbanística.","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"ART_006","Orden":"75","Pagina_Referencia":"4","Seccion":"ARTICULOS","Titulo":"ARTICULO_6_TITULO","Texto_Base":"Artículo 6.- Notificaciones. –","Tipo_Bloque":"FIJO","Variables":"","Fuente_Datos":"CSV","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"ART_006_A","Orden":"76","Pagina_Referencia":"4","Seccion":"ARTICULOS","Titulo":"ARTICULO_6_LITERAL_A","Texto_Base":"a) Notifíquese a {{TRATAMIENTO_ADMINISTRADO}} {{PROPIETARIO_NOMBRE}}, por medio de ventanilla de atención ciudadana y a la dirección electrónica: {{CORREO_NOTIFICACION}}, perteneciente al proyectista a cargo para recibir notificaciones, a quien se le conmina revise el presente acto administrativo de conformidad al Art. 133 del Código Orgánico Administrativo, a fin de que pueda solicitar aclaraciones, rectificaciones y subsanaciones, a los que hubiere lugar por concepto dudoso u oscuro, rectificación o subsanar los errores de copia, de referencia, de cálculos numéricos y, en general, los puramente materiales o de hecho que aparezcan de manifiesto en la presente resolución, dentro de los tres días siguientes al de la notificación.","Tipo_Bloque":"DINAMICO_ABOGADA","Variables":"TRATAMIENTO_ADMINISTRADO|PROPIETARIO_NOMBRE|CORREO_NOTIFICACION","Fuente_Datos":"Informe: propietario; phdu_resoluciones: correo precargado/confirmado por la abogada","Mostrar":"SI","Observacion_Interna":""},{"ID_Bloque":"ART_006_B","Orden":"77","Pagina_Referencia":"4","Seccion":"ARTICULOS","Titulo":"ARTICULO_6_LITERAL_B","Texto_Base function intWords(n){n=Math.floor(Math.abs(Number(n)||0));if(n===0)return 'cero';if(n<100)return under100(n);if(n<1000){if(n===100)return 'cien';const h=['','','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];return (n<200?'ciento':h[Math.floor(n/100)])+(n%100?' '+under100(n%100):'');}if(n<1000000){const th=Math.floor(n/1000),rest=n%1000;const a=th===1?'mil':intWords(th)+' mil';return a+(rest?' '+intWords(rest):'');}return String(n);}
function areaWords(v){const n=Number(String(v??'').replace(',','.'));if(!Number.isFinite(n))return '';const whole=Math.floor(n),dec=Math.round((n-whole)*100);let s=intWords(whole);if(dec)s+=' con '+String(dec).padStart(2,'0')+'/100';return s.toUpperCase()+' METROS CUADRADOS';}
function singularOwner(){const arr=Array.isArray(selected?.propietarios)?selected.propietarios:[];return arr.length<=1;}
function ownerNames(){const arr=Array.isArray(selected?.propietarios)?selected.propietarios:[];return arr.map(x=>String(x?.nombre||'').trim()).filter(Boolean).join(' Y ');}
function ownerDocs(){const arr=Array.isArray(selected?.propietarios)?selected.propietarios:[];return arr.map(x=>String(x?.ci||'').trim()).filter(Boolean).join(' / ');}
function defaultTreatment(){if(!singularOwner())return 'los señores';return 'el/la señor(a)';}

function qualityFromTreatment(t){t=norm(t);if(t.includes('SEÑORES'))return 'propietarios';if(t.includes('SEÑORA')&&!t.includes('(A)'))return 'propietaria';if(t.includes('SEÑOR')&&!t.includes('(A)'))return 'propietario';return 'propietario(a)';}
function extraKey(){return 'ALLPA_RESOLUCION_EXTRA_V5_'+String(selected?.informe_id||'DEMO');}
function loadExtra(){try{return JSON.parse(localStorage.getItem(extraKey())||'{}')||{};}catch(_){return {};}}

function technicalConclusion(){const rows=Array.isArray(selected?.conclusion_tecnica)?selected.conclusion_tecnica:[];const parts=rows.map(r=>{const d=String(r?.descripcion||'').trim(),q=String(r?.cantidad||'').trim(),u=String(r?.unidad||'').trim();return d?(d+': '+[q,u].filter(Boolean).join(' ')):'';}).filter(Boolean);return 'En concordancia a lo dispuesto en la Ordenanza No. 016-2023 de Actualización del Código Urbano, se concluye emitir el presente INFORME TÉCNICO FAVORABLE, de conformidad con el siguiente detalle: '+parts.join('; ')+'.';}
function variables(){
  const treatment=currentTreatment();const up=treatment.toUpperCase();const owners=ownerNames();const docs=ownerDocs();const ex=loadExtra();const p=selected?.proyecto||{},u=selected?.ubicacion||{},a=selected?.areas||{},g=selected?.gravamen||{},s=selected?.estructural||{},t=selected?.tecnico||{};
  const numRes=String(resolution?.numero_formateado||'').trim();
  return {
    EGOB:String(selected?.egob||''),NUMERO_RESOLUCION:numRes,DIRECTOR_NOMBRE:cfg('CFG_001'),DIRECTOR_CARGO:cfg('CFG_002'),ACCION_PERSONAL_DIRECTOR:cfg('CFG_003'),FECHA_ACCION_PERSONAL_DIRECTOR:cfg('CFG_004'),REGISTRADOR_PROPIEDAD:cfg('CFG_005'),MEMORANDO_CRITERIO_JURIDICO:cfg('CFG_006'),TEXTO_CRITERIO_JURIDICO:cfg('CFG_007'),
    FECHA_INGRESO_TRAMITE_LARGA:longDate(selected?.fecha_ingreso_tramite),PROYECTISTA_NOMBRE:String(selected?.proyectista?.nombre||''),TRATAMIENTO_PROPIETARIO:treatment,PROPIETARIO_NOMBRE:owners,PROPIETARIO_CEDULA:docs,CALIDAD_PROPIETARIO:qualityFromTreatment(treatment),PARROQUIA:String(u.parroquia||''),AREA_TOTAL_CERTIFICADO_LETRAS:areaWords(g.area_total_certificado),AREA_TOTAL_CERTIFICADO:String(g.area_total_certificado??''),CERTIFICADO_GRAVAMEN:String(g.certificado||''),FICHA_REGISTRAL:String(g.ficha_registral||''),FECHA_GRAVAMEN_LARGA:longDate(g.fecha),
    DOCUMENTO_ESTRUCTURAL:String(s.documento||''),FECHA_DOCUMENTO_ESTRUCTURAL_LARGA:longDate(s.fecha),TECNICO_ESTRUCTURAL:String(s.tecnico||''),CARGO_TECNICO_ESTRUCTURAL:String(getEl('rv5CargoEstructural')?.value||ex.cargoEstructural||''),CRITERIO_ESTRUCTURAL:String(s.criterio||''),ING_CALCULISTA:String(s.calculista||''),REG_SENESCYT_CALCULISTA:String(s.senescyt||''),
    NUMERO_MEMORANDO_REMISION:String(getEl('rv5MemoNumero')?.value||resolution?.numero_memorando_remision||''),FECHA_MEMORANDO_REMISION_LARGA:longDate(getEl('rv5MemoFecha')?.value||resolution?.fecha_memorando_remision),TECNICO_INFORME:String(t.nombre||''),CARGO_TECNICO_INFORME:String(t.cargo||''),CONCLUSION_TECNICA_INFORME:technicalConclusion(),AREA_CONSTRUCCION:String(a.construccion??''),NUMERO_INFORME_APROBATORIO:String(selected?.numero_informe_formateado||selected?.numero_formateado||''),
    NUMERO_COMPROBANTE:String(getEl('rv5PagoNumero')?.value||resolution?.numero_comprobante||''),FECHA_COMPROBANTE_LARGA:longDate(getEl('rv5PagoFecha')?.value||resolution?.fecha_comprobante),VALOR_COMPROBANTE:money(getEl('rv5PagoValor')?.value||resolution?.valor_comprobante),CONCEPTO_COMPROBANTE:String(getEl('rv5PagoConcepto')?.value||resolution?.concepto_comprobante||''),
    USO_PROYECTO:String(p.uso||''),TRATAMIENTO_PROPIETARIO_MAYUS:up,PROPIETARIO_NOMBRE_MAYUS:owners.toUpperCase(),PISOS_LETRAS:intWords(p.pisos||0),PISOS:String(p.pisos??''),SECTOR:String(u.barrio_sector||''),DIRECCION_PREDIO:String(u.direccion||''),ZONA_PLANEAMIENTO:String(u.codigo_pit||''),CLAVE_CATASTRAL:String(u.clave_catastral||''),PROYECTISTA_SENESCYT:String(selected?.proyectista?.senescyt||''),PROYECTISTA_REGISTRO_MUNICIPAL:String(selected?.proyectista?.registro_municipal||''),
    TRATAMIENTO_ADMINISTRADO:treatment,CORREO_NOTIFICACION:String(getEl('rv5Correo')?.value||resolution?.correo_notificacion||selected?.correo_notificacion_sugerido||''),FECHA_RESOLUCION_LARGA:longDate(getEl('rv5FechaResolucion')?.value||resolution?.fecha_resolucion),ABOGADA_FIRMA_NOMBRE:String(profile?.firma_nombre||profile?.nombre_completo||''),ABOGADA_FIRMA_CARGO:String(profile?.firma_cargo||profile?.cargo||'')
  };
}
function templateText(row,vars,mode){let text=String(row.Texto_Base||'');const missing=[];text=text.replace(/\{\{([A-Z0-9_]+)\}\}/g,(m,k)=>{if(k==='NUMERO_RESOLUCION'){if(mode==='storage')return m;return vars[k]||'PENDIENTE DE ASIGNACIÓN';}const v=String(vars[k]??'').trim();if(!v){if(OPTIONAL_VARS.has(k))return '';missing.push(k);return `⟦FALTA:${k}⟧`;}return v;});text=text.replace(/,\s*,/g,',').replace(/\s+,/g,',').replace(/\s{2,}/g,' ').replace(/,\s+del que/g,', del que');return {text,missing};}
function renderedBlocks(mode='preview'){const vars=variables();const blocks=[];const missing=new Set();TEMPLATE_ROWS.filter(r=>norm(r.Mostrar)!=='NO'&&r.Seccion!=='CONFIGURACION').sort((a,b)=>Number(a.Orden)-Number(b.Orden)).forEach(r=>{const z=templateText(r,vars,mode);z.missing.forEach(x=>missing.add(x));blocks.push({id:r.ID_Bloque,orden:Number(r.Orden)||0,seccion:r.Seccion,titulo:r.Titulo,tipo:r.Tipo_Bloque,texto:z.text});});return {blocks,missing:[...missing]};}
function renderPreview(){if(!selected){getEl('rv5Preview')?.replaceChildren();return;}saveExtra();const x=renderedBlocks('preview');lastPreview=x;const p=getEl('rv5Preview');if(!p)return;let html='';let current='';const sig=[];for(const b of x.blocks){if(b.seccion!==current){current=b.seccion;if(!['ENCABEZADO','FIRMAS'].includes(current))html+=`<div class="section-mark">${esc(current.replaceAll('_',' '))}</div>`;}let t=esc(b.texto).replace(/⟦FALTA:([^⟧]+)⟧/g,'<span class="missing">FALTA: $1</span>').replaceAll('\n','<br>');if(b.seccion==='ENCABEZADO'){let cls='enc';if(b.id==='ENC_001')cls+=' main';if(b.id==='ENC_002')cls+=' license';if(['ENC_003','ENC_004'].includes(b.id))cls+=' person';if(b.id==='ENC_002'&&!resolution?.numero_formateado)t=t.replace('PENDIENTE DE ASIGNACIÓN','<span class="pending-number">PENDIENTE DE ASIGNACIÓN</span>');html+=`<div class="${cls}">${t}</div>`;}else if(b.seccion==='FIRMAS'){sig.push(b);}else if(b.id==='RES_001'||b.id==='CIE_001')html+=`<div class="${b.id==='RES_001'?'resolve':'closing'}">${t}</div>`;else if(b.id==='CIE_002')html+=`<div class="date">${t}</div>`;else html+=`<p>${t}</p>`;}
    if(sig.length){html+='<div class="signature-grid">'+sig.map(b=>{const parts=String(b.texto||'').split('|');return `<div class="signature"><div>${esc(parts[0]||'')}</div><strong>${esc(parts[1]||'')}</strong><div>${esc(parts[2]||'')}</div></div>`;}).join('')+'</div>';}
    p.innerHTML=html;renderValidation(x.missing);updateResolutionNumber();}
function renderValidation(missing){const el=getEl('rv5Validation');if(!el)return;const items=[];const legal=legalPayload();if(!selected?.fecha_ingreso_tramite)items.push(['bad','Falta la fecha de ingreso del trámite en el Informe Técnico.']);if(!selected?.numero_informe_formateado&&!demoMode)items.push(['bad','El Informe no tiene número oficial.']);if(!legal.fecha_resolucion)items.push(['bad','Falta la fecha de la Resolución.']);if(!legal.numero_memorando_remision)items.push(['bad','Falta el Memorando de remisión.']);if(!legal.fecha_memorando_remision)items.push(['bad','Falta la fecha del Memorando de remisión.']);if(!legal.numero_comprobante)items.push(['bad','Falta el número del comprobante.']);if(!legal.fecha_comprobante)items.push(['bad','Falta la fecha del comprobante.']);if(String(legal.valor_comprobante||'').trim()==='')items.push(['bad','Falta el valor del comprobante.']);if(!legal.concepto_comprobante)items.push(['bad','Falta el concepto del comprobante.']);if(!legal.correo_notificacion)items.push(['bad','Falta el correo de notificación.']);missing.forEach(k=>items.push(['bad','La plantilla requiere el dato '+k+'.']));if(!String(getEl('rv5CargoEstructural')?.value||'').trim())items.push(['warn','El Informe no almacena el cargo del técnico estructural; el texto se generará sin ese cargo.']);if(demoMode)items.push(['warn','Modo demostración local: no se puede guardar ni finalizar.']);if(!items.some(x=>x[0]==='bad'))items.push(['good','La Resolución tiene los datos requeridos para la vista previa'+(demoMode?'.':' y puede guardarse/finalizarse según su estado.')]);el.innerHTML=items.map(([c,t])=>`<div class="x ${c}">${c==='bad'?'✕':c==='warn'?'⚠':'✓'} ${esc(t)}</div>`).join('');return items;}
function legalPayload(){return {informe_id:String(selected?.informe_id||''),fecha_resolucion:String(getEl('rv5FechaResolucion')?.value||''),numero_memorando_remision:String(getEl('rv5MemoNumero')?.value||'').trim(),fecha_memorando_remision:String(getEl('rv5MemoFecha')?.value||''),numero_comprobante:String(getEl('rv5PagoNumero')?.value||'').trim(),fecha_comprobante:String(getEl('rv5PagoFecha')?.value||''),valor_comprobante:String(getEl('rv5PagoValor')?.value||'').trim(),concepto_comprobante:String(getEl('rv5PagoConcepto')?.value||'').trim(),correo_notificacion:String(getEl('rv5Correo')?.value||'').trim().toLowerCase()};}
function validationHasErrors(){const miss=renderedBlocks('preview').missing;const items=renderValidation(miss);return items.some(x=>x[0]==='bad');}

function profileHtml(){if(!profile)return '<div class="rv5-mini">Sin sesión.</div>';return `<div class="rv5-mini"><strong style="color:#17324d">${esc(profile.nombre_completo||user?.email||'USUARIO')}</strong><br>${esc(profile.correo||user?.email||'')}<br>Rol: <strong>${esc(profile.rol||'—')}</strong> · ${profile.activo?'ACTIVO':'INACTIVO'}</div>`;}

async function fetchProfile(){const {data,error}=await client.from('phdu_profiles').select('id, correo, nombre_completo, rol, activo, cargo, firma_nombre, firma_cargo').eq('id',user.id).single();if(error)throw error;profile=data;updateProfile();if(!canRead())throw new Error('El rol '+(profile?.rol||'—')+' no tiene acceso al módulo de Resoluciones.');return data;}
async function login(){const email=String(getEl('rv5Email')?.value||'').trim(),password=String(getEl('rv5Password')?.value||'');if(!email||!password){setStatus('Ingrese correo y contraseña PHDU.','error');return;}if(!client){setStatus('No se pudo cargar Supabase.','error');return;}setStatus('Iniciando sesión…');try{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;user=data.user;await fetchProfile();if(getEl('rv5Password'))getEl('rv5Password').value='';setStatus('Sesión iniciada: '+(profile.nombre_completo||email)+' · '+profile.rol+'.','ok');await loadReports();}catch(err){profile=null;user=null;updateProfile();setStatus('No se pudo iniciar sesión: '+String(err?.message||err),'error');}}

async function loadReports(){if(!canRead())return;setStatus('Consultando Informes Técnicos finalizados…');try{const data=await rpc('phdu_listar_informes_para_resolucion');reports=Array.isArray(data)?data:[];renderList();setStatus('Informes disponibles para Resolución: '+reports.length+'.','ok');}catch(err){setStatus('No se pudo consultar Informes: '+String(err?.message||err),'error');}}
function filteredReports(){const q=norm(getEl('rv5Search')?.value||''),f=String(getEl('rv5Filter')?.value||'TODOS');return reports.filter(r=>{const st=String(r.estado_resolucion||'SIN_RESOLUCION');if(f!=='TODOS'&&st!==f)return false;if(!q)return true;return norm([r.numero_formateado,r.egob,r.propietario,r.nombre_proyecto,r.tecnico_nombre,r.numero_resolucion].join(' ')).includes(q);});}

async function selectInforme(id){if(!canRead()){setStatus('Inicie sesión con un perfil autorizado.','error');return;}setStatus('Cargando Informe '+id+'…');try{const data=await rpc('phdu_obtener_informe_para_resolucion',{p_informe_id:id});selected=data;resolution=data?.resolucion||null;demoMode=false;renderList();renderWorkspace();setStatus('Informe '+(selected.numero_informe_formateado||'')+' cargado para Resolución.','ok');}catch(err){setStatus('No se pudo cargar el Informe: '+String(err?.message||err),'error');}}

function fillLegalForm(){const final=resolution?.estado==='FINALIZADA',readOnly=!canWrite()||final||demoMode;const set=(id,v)=>{const e=getEl(id);if(e){e.value=v??'';e.disabled=readOnly;}};set('rv5FechaResolucion',resolution?.fecha_resolucion||todayLocal());set('rv5MemoNumero',resolution?.numero_memorando_remision||'');set('rv5MemoFecha',resolution?.fecha_memorando_remision||'');set('rv5PagoNumero',resolution?.numero_comprobante||'');set('rv5PagoFecha',resolution?.fecha_comprobante||'');set('rv5PagoValor',resolution?.valor_comprobante??'');set('rv5PagoConcepto',resolution?.concepto_comprobante||'');set('rv5Correo',resolution?.correo_notificacion||selected?.correo_notificacion_sugerido||'');const ex=loadExtra();set('rv5Tratamiento',ex.tratamiento||defaultTreatment());set('rv5CargoEstructural',ex.cargoEstructural||'');document.querySelectorAll('#rv5LegalForm input,#rv5LegalForm textarea,#rv5LegalForm select').forEach(e=>e.disabled=readOnly);setBusy(false);}

async function saveDraft(silent=false){if(demoMode)throw new Error('El modo demostración no guarda datos.');if(!canWrite())throw new Error('Su perfil no puede guardar Resoluciones.');if(!selected?.informe_id)throw new Error('Seleccione un Informe Técnico.');saveExtra();const payload=legalPayload();setBusy(true);if(!silent)setStatus('Guardando borrador de Resolución…');try{const data=await rpc('phdu_guardar_borrador_resolucion',{p_payload:payload});const row=Array.isArray(data)?data[0]:data;if(!row?.resolucion_id)throw new Error('Supabase no devolvió el identificador del borrador.');resolution={...(resolution||{}),id:row.resolucion_id,estado:row.estado,fecha_resolucion:row.fecha_resolucion,numero_memorando_remision:row.numero_memorando_remision,fecha_memorando_remision:row.fecha_memorando_remision,numero_comprobante:row.numero_comprobante,fecha_comprobante:row.fecha_comprobante,valor_comprobante:row.valor_comprobante,concepto_comprobante:row.concepto_comprobante,correo_notificacion:row.correo_notificacion};if(!silent)setStatus((row.creado_nuevo?'Borrador creado':'Borrador actualizado')+' correctamente. No se asignó ningún número.','ok');await loadReports();renderWorkspace();return row;}catch(err){if(!silent)setStatus('No se pudo guardar el borrador: '+String(err?.message||err),'error');throw err;}finally{setBusy(false);}}
async function finalizeResolution(){if(demoMode){setStatus('La demostración local no puede finalizarse.','error');return;}if(!canWrite()){setStatus('Su perfil no puede finalizar Resoluciones.','error');return;}renderPreview();if(validationHasErrors()){setStatus('No se puede finalizar: existen datos obligatorios pendientes. Revise la validación.','error');return;}const ok=window.confirm('FINALIZAR RESOLUCIÓN Y ASIGNAR NÚMERO OFICIAL\n\nInforme: '+(selected.numero_informe_formateado||'')+'\neGOB: '+selected.egob+'\nPropietario: '+ownerNames()+'\n\nSupabase asignará automáticamente el siguiente número oficial disponible de Resoluciones de Obra Mayor. La Abogada no selecciona ni escribe ese número.\n\n¿Desea continuar?');if(!ok)return;setBusy(true);setStatus('Guardando datos y preparando finalización…');try{if(!resolution?.id||resolution?.estado!=='BORRADOR')await saveDraft(true);else await saveDraft(true);const stored=renderedBlocks('storage');if(stored.missing.length)throw new Error('La plantilla tiene datos pendientes: '+stored.missing.join(', '));const payload={resolucion_id:resolution.id,bloques_renderizados:stored.blocks,plantilla_version:String(TEMPLATE_META.version||'resolucion_obra_mayor_texto_base_v2'),plantilla_hash:String(TEMPLATE_META.sha256||'')};setStatus('Solicitando número oficial a Supabase…');const data=await rpc('phdu_finalizar_resolucion',{p_payload:payload});const row=Array.isArray(data)?data[0]:data;if(!row?.numero_formateado)throw new Error('Supabase no devolvió el número oficial de la Resolución.');resolution={...(resolution||{}),id:row.resolucion_id,estado:row.estado,numero:row.numero,numero_formateado:row.numero_formateado,anio:row.anio,fecha_resolucion:row.fecha_resolucion,finalizado_en:row.finalizado_en};setStatus((row.ya_existia?'La Resolución ya estaba finalizada. Se recuperó ':'Resolución finalizada. Número oficial asignado: ')+row.numero_formateado+'.','ok');await loadReports();renderWorkspace();}catch(err){setStatus('No se pudo finalizar la Resolución: '+String(err?.message||err),'error');}finally{setBusy(false);}}
async function copyText(){if(!selected)return;renderPreview();const text=getEl('rv5Preview')?.innerText||'';try{await navigator.clipboard.writeText(text);setStatus('Texto de la Resolución copiado al portapapeles.','ok');}catch(err){setStatus('No se pudo copiar el texto: '+String(err?.message||err),'error');}}
function printPreview(){if(!selected)return;renderPreview();const body=getEl('rv5Preview')?.innerHTML||'';const w=window.open('','_blank','width=900,height=900');if(!w){setStatus('El navegador bloqueó la ventana de impresión.','error');return;}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Resolución ${esc(resolution?.numero_formateado||'Pendiente')}</title><style>@page{size:A4;margin:18mm}body{font-family:Arial,sans-serif;font-size:11pt;line-height:1.45;color:#111}.enc{text-align:center;margin-bottom:7px}.main{font-weight:bold;font-size:14pt}.license{font-weight:bold;font-size:13pt}.person{font-weight:bold}p{text-align:justify;margin:0 0 10px}.resolve,.closing{text-align:center;font-weight:bold;margin:14px 0}.date{text-align:right;margin-top:14px}.signature-grid{display:grid;grid-template-columns:1fr 1fr;gap:55px;margin-top:65px;text-align:center}.signature{border-top:1px solid #333;padding-top:5px}.section-mark{display:none}.missing{background:#fff1a8}.pending-number{color:#8a5e00}</style></head><body>${body}</body></html>`);w.document.close();setTimeout(()=>{w.focus();w.print();},250);}
