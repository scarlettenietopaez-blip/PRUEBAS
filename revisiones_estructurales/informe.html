function numberValue(v){const n=Number(String(v??'').replace(',','.').replace(/[^\d.-]/g,''));return Number.isFinite(n)?n:0}

function structureApplies(r){const raw=upper(r.Estructuras||'');if(!raw)return true;const code=upper(state.tipoEstructura);if(!code)return false;return raw.split('|').map(x=>x.trim()).includes(code)}
function conditionApplies(r){
 const c=upper(r.Condicion||'');if(!c)return true;
 const ctl=state.controles||{};
 if(c==='SISMO_REGULAR')return ctl.sismo==='REGULAR';
 if(c==='SISMO_IRREGULAR')return ctl.sismo==='IRREGULAR';
 if(c==='SISMO_ESENCIAL')return ctl.sismo==='ESENCIAL';
 if(c==='OTROS_ELEMENTOS')return !!ctl.otrosElementos;
 if(c==='LOSA_ALIVIANADA')return Array.isArray(ctl.losas)&&ctl.losas.includes('ALIVIANADA');
 if(c==='LOSA_DECK')return Array.isArray(ctl.losas)&&ctl.losas.includes('DECK');
 if(c==='LOSA_CUBIERTA')return Array.isArray(ctl.losas)&&ctl.losas.includes('CUBIERTA');
 if(c==='ESCALERAS_MEMORIA')return !!ctl.escalerasMemoria;
 if(c==='ESCALERAS_PLANOS')return !!ctl.escalerasPlanos;
 if(c==='MIXTA_COLUMNAS_ACERO')return upper(state.tipoEstructura)==='ACERO'||(upper(state.tipoEstructura)==='MIXTA'&&!!ctl.mixtaColumnasAcero);
 if(c==='MIXTA_VIGAS_ACERO')return upper(state.tipoEstructura)==='ACERO'||(upper(state.tipoEstructura)==='MIXTA'&&!!ctl.mixtaVigasAcero);
 return true
}

function reqObj(key,id,r=null){
 if(!state.requisitos[key])state.requisitos[key]={};

 const o=state.requisitos[key][id];
 if(!Array.isArray(o.imagenes))o.imagenes=o.imagen?[o.imagen]:[];

function allowedStates(r){

 if(raw)return raw.split('|').map(x=>x.trim()).filter(Boolean).map(x=>x==='NO_CUMPLE'?'No Cumple':x==='NO_APLICA'?'No Aplica':x==='CUMPLE'?'Cumple':x);

function controlHtml(r){
 const ctl=upper(r.Control||''),c=state.controles||{};

   return `<div class="req-control-box"><strong>Tipo(s):</strong>${opts.map(([v,l])=>`<label><input type="checkbox" ${selected.includes(v)?'checked':''} onchange="toggleArrayControl('losas','${v}',this.checked)"> ${l}</label>`).join('')}</div>`

function renderRequirements(){

async function compressReqImage(file){const original=await readImage(file);return new Promise(resolve=>{const img=new Image();img.onload=()=>{try{let w=img.naturalWidth||img.width,hg=img.naturalHeight||img.height;const max=1200,scale=Math.min(1,max/Math.max(w,hg));const cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(hg*scale));const c=document.createElement('canvas');c.width=cw;c.height=ch;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,cw,ch);resolve(c.toDataURL('image/jpeg',.82))}catch(_){resolve(original)}};img.onerror=()=>resolve(original);img.src=original})}

function baseLegalObsHtml(){return `<p class="report-legal-title">Constitución de la República del Ecuador.</p><p><strong>Artículo 82.-</strong> El derecho a la seguridad jurídica se fundamenta en el respeto a la Constitución y en la existencia de normas jurídicas previas, claras, públicas y aplicadas por las autoridades competentes.</p><p><strong>Artículo 226.-</strong> Las instituciones del Estado, sus organismos, dependencias, las servidoras o servidores públicos y las personas que actúen en virtud de una potestad estatal ejercerán solamente las competencias y facultades que les sean atribuidas en la Constitución y la ley. Tendrán el deber de coordinar acciones para el cumplimiento de sus fines y hacer efectivo el goce y ejercicio de los derechos reconocidos en la Constitución.</p><p class="report-legal-title">Código Orgánico Administrativo.</p><p><strong>Artículo 140 dice:</strong> “Subsanaciones. Cuando alguno de los actos de la persona interesada no reúna los requisitos necesarios, la administración pública le notificará para que, en el término de diez días, subsane su omisión. La administración pública especificará los requisitos que deben ser enmendados por la persona interesada con la indicación de su fundamento legal, técnico o económico y las instrucciones detalladas del modo en que debe proceder para subsanar las deficiencias. Si la persona interesada no cumple lo dispuesto por la administración pública se entenderá como desistimiento y será declarado en la resolución. La administración pública no podrá disponer el archivo del procedimiento o la restitución de la petición a la persona interesada sin haber dispuesto la subsanación. Su omisión constituye una falta grave del servidor público y no suspende el procedimiento administrativo para todos los propósitos previstos en este Código.</p><p><strong>Artículo 183.-</strong> Iniciativa. El procedimiento administrativo puede iniciarse de oficio o a solicitud de la persona interesada. A solicitud de la persona interesada de la forma y con los requisitos previstos en este Código. De oficio, mediante decisión del órgano competente, bien por iniciativa propia o como consecuencia de orden superior, a petición razonada de otros órganos administrativos o por denuncia. Y demás en uso de las atribuciones contempladas en la Ordenanza 016-2023 que contiene el Código Urbano para el cantón Riobamba.</p>`}
function reportObservaciones(includeBackground=true){const obs=selectedObservations();const rows=obs.map((o,idx)=>`<tr><td class="nro-col">${idx+1}</td><td class="req-col">${h(o.requisito)}</td><td class="clar-col">${h(o.observacion||'')}</td></tr>${o.imagenes?.length?`<tr><td></td><td colspan="2"><div class="report-img-gallery">${o.imagenes.map((src,j)=>`<img src="${h(src)}" alt="Imagen ${j+1}">`).join('')}</div></td></tr>`:''}`).join('');const nota=clean(state.obsNota);const notaHtml=nota?`<div class="report-section-title"><span>4.</span><span>NOTA (opcional)</span></div><div class="report-note-box"><p>${h(nota)}</p></div>`:'';const conclusionN=nota?'5.':'4.';return `<div class="report-shell" id="printReport"><img class="report-print-bg" src="../assets/fondo_institucional.png" alt="" aria-hidden="true"><div class="report-content"><div class="report-document-title"><span class="municipio">GOBIERNO AUTÓNOMO DESCENTRALIZADO MUNICIPAL RIOBAMBA</span><span class="tipo">INFORME TÉCNICO DE OBSERVACIONES OBRA MAYOR - REVISIÓN ESTRUCTURAL</span></div><div class="report-section-title"><span>1.</span><span>ANTECEDENTES</span></div><p>${antecedenteObsHtml()}</p><div class="report-section-title"><span>2.</span><span>BASE LEGAL</span></div>${baseLegalObsHtml()}<div class="report-section-title"><span>3.</span><span>CRITERIO TÉCNICO</span></div>${obs.length?`<table class="report-table"><thead><tr><th class="nro-col">Nro.</th><th class="req-col">Requisito</th><th class="clar-col">Aclaración</th></tr></thead><tbody>${rows}</tbody></table>`:'<p>No se registran requisitos marcados como No Cumple.</p>'}${notaHtml}<div class="report-section-title"><span>${conclusionN}</span><span>CONCLUSIONES</span></div><p>Por las observaciones antes expuestas se emite Criterio Técnico <strong>NO FAVORABLE</strong>.</p><p>Con la documentación requerida presentarse hasta el día <strong>${h(fmt(state.info.fechaSubsanacion||''))}</strong>, (10 días hábiles) ingresada mediante ventanilla de atención ciuda async function richCopy(html,plain){if(navigator.clipboard?.write&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain||html.replace(/<[^>]+>/g,' ')],{type:'text/plain'})})]);return}const d=document.createElement('div');d.contentEditable='true';d.style.position='fixed';d.style.left='-9999px';d.innerHTML=html;document.body.appendChild(d);const r=document.createRange();r.selectNodeContents(d);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();d.remove()}

const STRUCT_REPORT_BG='../assets/fondo_institucional.png';
function newStructA4Page(root){
  const page=document.createElement('section');page.className='struct-a4-page';
  const bg=document.createElement('img');bg.className='struct-page-bg';bg.src=STRUCT_REPORT_BG;bg.alt='';bg.setAttribute('aria-hidden','true');
  const content=document.createElement('div');content.className='struct-page-content';
  const flow=document.createElement('div');flow.className='struct-page-flow';
  content.appendChild(flow);page.appendChild(bg);page.appendChild(content);root.appendChild(page);
  return {page,flow,bg};
}
function structPageFits(ctx){return ctx.flow.scrollHeight<=ctx.flow.clientHeight+1}
function structClone(el){const c=el.cloneNode(true);c.removeAttribute?.('id');c.querySelectorAll?.('[id]').forEach(x=>x.removeAttribute('id'));return c}
function structRowGroups(table){const rows=[...table.querySelectorAll(':scope > tbody > tr')],groups=[];for(let i=0;i<rows.length;i++){const g=[rows[i]];if(i+1<rows.length&&rows[i+1].querySelector('.report-img-gallery'))g.push(rows[++i]);groups.push(g)}return groups}
function appendStructTablePaginated(sourceTable,ctx,newPage){
  const groups=structRowGroups(sourceTable);let table=null,tbody=null;
  const startTable=()=>{table=sourceTable.cloneNode(false);table.removeAttribute('id');const thead=sourceTable.querySelector(':scope > thead');if(thead)table.appendChild(structClone(thead));tbody=document.createElement('tbody');table.appendChild(tbody);ctx.flow.appendChild(table)};
  startTable();
  for(const group of groups){
    const clones=group.map(structClone);clones.forEach(r=>tbody.appendChild(r));
    if(!structPageFits(ctx)){
      clones.forEach(r=>r.remove());
      if(tbody.children.length===0){clones.forEach(r=>tbody.appendChild(r));continue}
      ctx=newPage();startTable();clones.forEach(r=>tbody.appendChild(r));
    }
  }
  return ctx;
}
function buildPagedPreviewStruct(){
  const root=$('structPagedPreview'),source=$('structReportSourceHost')?.querySelector('.report-content');if(!root||!source)return;
  root.innerHTML='';let ctx=newStructA4Page(root);const newPage=()=>{ctx=newStructA4Page(root);return ctx};
  const children=[...source.children];
  for(let i=0;i<children.length;i++){
    const el=children[i];
    if(el.matches('table.report-table')){ctx=appendStructTablePaginated(el,ctx,newPage);continue}
    if(el.classList.contains('report-section-title')&&i+1<children.length){
      const next=children[i+1];
      if(next.matches('table.report-table')){
        const heading=structClone(el);ctx.flow.appendChild(heading);
        const probe=next.cloneNode(false);const th=next.querySelector(':scope > thead');if(th)probe.appendChild(structClone(th));const tb=document.createElement('tbody');const firstGroup=structRowGroups(next)[0]||[];firstGroup.forEach(r=>tb.appendChild(structClone(r)));probe.appendChild(tb);ctx.flow.appendChild(probe);

function longDateStruct(value){const d=value?new Date(value):new Date();if(Number.isNaN(d.getTime()))return String(value||'');const m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return `${d.getDate()} de ${m[d.getMonth()]} de ${d.getFullYear()}`}

function sientoStruct(){const n=ensureNotificationStruct(),d=n.fechaHoraNotificacion?new Date(n.fechaHoraNotificacion):null;const date=d?longDateStruct(d):'—';const time=d?d.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}):'—';const mails=allEmailsStruct().join(', ');return {title:'SIENTO RAZÓN',text:`Siento por tal que, con fecha ${date}, a las ${time}, se notificó al señor(a) ${state.info.proyectista||'PROYECTISTA'} con el Informe Técnico de Observaciones Estructurales – Trámite E-GOB N.° ${state.info.egob||''} – Obra Mayor – Proyecto Definitivo, a fin de que proceda con su correspondiente subsanación. Para el efecto, se le ha concedido el término de diez (10) días hábiles, contados a partir de la presente notificación. La misma fue remitida al correo electrónico ${mails||'—'}, señalado para recibir notificaciones.`}}
async function loadProfessionalEmailsStruct(){if(professionalEmailsStruct.length)return;const rows=await loadCSV('../data/profesionales.csv');professionalEmailsStruct=rows.map(r=>{const keys=Object.keys(r);const get=(names)=>{for(const n of names){const k=keys.find(x=>normSearchStruct(x)===normSearchStruct(n));if(k&&clean(r[k]))return clean(r[k])}return''};return{nombre:get(['Nombre','Profesional','Proyectista','Nombres y Apellidos','Apellidos y Nombres']),correo:get(['Correo electrónico','Correo Electronico','Correo','Email','E-mail','Mail'])}}).filter(x=>x.nombre&&x.correo)}
function lookupProjectEmailStruct(){const n=normSearchStruct(state.info.proyectista);if(!n)return'';const x=professionalEmailsStruct.find(x=>normSearchStruct(x.nombre)===n)||professionalEmailsStruct.find(x=>normSearchStruct(x.nombre).includes(n)||n.includes(normSearchStruct(x.nombre)));return x?.correo||''}
window.useRegisteredEmailStruct=async function(){await loadProfessionalEmailsStruct();const found=lookupProjectEmailStruct();if(!found)return alert('No se encontró un correo para el proyectista en el registro de profesionales. Puede escribirlo manualmente.');const n=ensureNotificationStruct();n.correo=found;n.correoAuto=found;n.correoManual=false;saveLocal();renderNotificationStruct();}
window.updateNotificationEmailStruct=function(v){const n=ensureNotificationStruct();n.correo=clean(v);n.correoManual=true;saveLocal();renderNotificationPreviewsStruct()}
window.addAdditionalEmailStruct=function(){ensureNotificationStruct().correosAdicionales.push('');saveLocal();renderNotificationStruct()}
window.updateAdditionalEmailStruct=function(i,v){const n=ensureNotificationStruct();while(n.correosAdicionales.length<=i)n.correosAdicionales.push('');n.correosAdicionales[i]=clean(v);saveLocal();renderNotificationPreviewsStruct()}
window.removeAdditionalEmailStruct=function(i){ensureNotificationStruct().correosAdicionales.splice(i,1);saveLocal();renderNotificationStruct()}
function renderNotificationPreviewsStruct(){const e=notificationEmailStruct(),siento=sientoStruct();if($('emailSubjectStruct'))$('emailSubjectStruct').textContent='Asunto: '+e.subject;if($('emailBodyStruct'))$('emailBodyStruct').textContent=e.body;if($('sientoTitleStruct'))$('sientoTitleStruct').textContent=siento.title;if($('sientoTextStruct'))$('sientoTextStruct').textContent=siento.text}
function backupStatusStruct(){const n=ensureNotificationStruct();if(notificationPdfsStruct.length)return `<ul class="selected-pdfs">${notificationPdfsStruct.map((f,i)=>`<li><span>${h(f.name)}</span><button type="button" onclick="removeNotificationPdfStruct(${i})">Quitar</button></li>`).join('')}</ul>`;if(n.respaldoNombres.length)return `<div class="noti-note">Debe seleccionar nuevamente los PDF para generar el Siento Razón.</div><ul class="selected-pdfs">${n.respaldoNombres.map((f,i)=>`<li><span>${h(f)}</span><button type="button" onclick="removeNotificationPdfStruct(${i})">Quitar</button></li>`).join('')}</ul>`;return '<div class="noti-note">No se han seleccionado archivos PDF.</div>'}
window.selectNotificationPdfsStruct=function(input){const add=[...(input?.files||[])].filter(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));const keys=new Set(notificationPdfsStruct.map(f=>`${f.name}|${f.size}|${f.lastModified}`));for(const f of add){const k=`${f.name}|${f.size}|${f.lastModified}`;if(!keys.has(k)){notificationPdfsStruct.push(f);keys.add(k)}}const n=ensureNotificationStruct();n.respaldoNombres=notificationPdfsStruct.map(f=>f.name);saveLocal();renderNotificationStruct()}
window.removeNotificationPdfStruct=function(i){if(notificationPdfsStruct.length)notificationPdfsStruct.splice(i,1);else ensureNotificationStruct().respaldoNombres.splice(i,1);ensureNotificationStruct().respaldoNombres=notificationPdfsStruct.length?notificationPdfsStruct.map(f=>f.name):ensureNotificationStruct().respaldoNombres;saveLocal();renderNotificationStruct()}
async function copyPlainStruct(text){try{await navigator.clipboard.writeText(text)}catch(_){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}
window.copyNotificationStruct=async function(){const d=notificationEmailStruct();await copyPlainStruct(`Asunto: ${d.subject}\n\n${d.body}`);setStatus('Contenido del correo copiado.','ok')}
window.openInstitutionalMailStruct=async function(){const emails=allEmailsStruct();if(!emails.length||emails.some(x=>!validEmailStruct(x)))return alert('Revise que el correo principal y todos los correos adicionales sean válidos.');const n=ensureNotificationStruct();n.fechaHoraNotificacion=new Date().toISOString();saveLocal();const d=notificationEmailStruct();await copyPlainStruct(d.body);const owa=new URL('https://maile.gadmriobamba.gob.ec/');owa.searchParams.set('path','/mail/action/compose');owa.searchParams.set('to',emails.join(';'));owa.searchParams.set('subject',d.subject);owa.searchParams.set('body',d.body.replace(/\r?\n/g,'\n'));const full=owa.toString();if(full.length>3900)owa.searchParams.delete('body');const pop=window.open(owa.toString(),'_blank');if(pop)try{pop.opener=null}catch(_){}else location.href=owa.toString();renderNotificationStruct();setStatus('Notificación preparada en el correo institucional.','ok')}
async function ensurePdfLibStruct(){if(window.PDFLib)return window.PDFLib;for(const url of ['https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js','https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js']){try{await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=url;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});if(window.PDFLib)return window.PDFLib}catch(_){}}throw new Error('No se pudo cargar el generador PDF.')}
async function fetchBackgroundStruct(){let last;for(const p of ['../assets/fondo_institucional.png','assets/fondo_institucional.png']){try{const r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return await r.arrayBuffer()}catch(e){last=e}}throw last||new Error('No se encontró el fondo institucional.')}
function wrapPdfStruct(text,font,size,maxWidth){const out=[];for(const paragraph of String(text||'').split(/\n/)){if(!paragraph.trim()){out.push('');continue}let line='';for(const word of paragraph.split(/\s+/)){const test=line?line+' '+word:word;if(font.widthOfTextAtSize(test,size)<=maxWidth)line=test;else{if(line)out.push(line);line=word}}if(line)out.push(line)}return out}
window.generateSientoPdfStruct=async function(){const n=ensureNotificationStruct(),emails=allEmailsStruct();if(!emails.length||emails.some(x=>!validEmailStruct(x)))return alert('Revise los correos antes de generar el Siento Razón.');if(!n.fechaHoraNotificacion)return alert('Presione NOTIFICAR antes de generar el Siento Razón.');if(!notificationPdfsStruct.length)return alert('Seleccione uno o varios PDF de respaldo de la notificación.');try{const P=await ensurePdfLibStruct(),{PDFDocument,StandardFonts,rgb}=P,pdf=await PDFDocument.create(),page=pdf.addPage([595.28,841.89]),w=page.getWidth(),hh=page.getHeight(),bg=await pdf.embedPng(await fetchBackgroundStruct()),font=await pdf.embedFont(StandardFonts.Helvetica);page.drawImage(bg,{x:0,y:0,width:w,height:hh});let y=hh-155;for(const line of wrapPdfStruct(sientoStruct().text,font,11,445)){if(!line){y-=10;continue}page.drawText(line,{x:75,y,size:11,font,color:rgb(0,0,0)});y-=17}for(const file of notificationPdfsStruct){const ev=await PDFDocument.load(await file.arrayBuffer(),{ignoreEncryption:false}),pages=await pdf.copyPages(ev,ev.getPageIndices());pages.forEach(p=>pdf.addPage(p))}pdf.setTitle(`Siento Razón eGOB ${state.info.egob||''}`);const bytes=await pdf.save(),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download=`SIENTO_RAZON_EGOB_${String(state.info.egob||'SIN_NUMERO').replace(/[^0-9A-Za-z_-]/g,'_')}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);setStatus('PDF Siento Razón generado correctamente.','ok')}catch(e){alert('No se pudo generar el PDF: '+(e.message||e))}}
function renderNotificationStruct(){const panel=$('notificationPanel');if(!panel)return;if(state.tipo!=='OBSERVACIONES'){panel.innerHTML='<p class="mini">Esta pestaña está disponible únicamente para Informes con Observaciones.</p>';return}const n=ensureNotificationStruct(),e=notificationEmailStruct(),sr=sientoStruct();panel.innerHTML=`<h2 class="struct-tab-title">NOTIFICAR / SIENTO RAZÓN eGOB</h2><div class="noti-grid"><section class="noti-card"><div class="noti-title">1. NOTIFICAR</div><div class="field"><label>CORREO ELECTRÓNICO PRINCIPAL *</label><input type="email" value="${h(n.correo||'')}" placeholder="correo@dominio.com" oninput="updateNotificationEmailStruct(this.value)"><div class="noti-note">Puede autocompletarse con el correo del proyectista registrado o escribirse manualmente.</div></div><div class="field"><label>CORREOS ELECTRÓNICOS ADICIONALES</label><div class="extra-email-list">${n.correosAdicionales.map((x,i)=>`<div class="extra-email-row"><input type="email" value="${h(x)}" placeholder="correo adicional" oninput="updateAdditionalEmailStruct(${i},this.value)"><button type="button" class="danger" onclick="removeAdditionalEmailStruct(${i})">QUITAR</button></div>`).join('')}</div><button type="button" class="secondary" onclick="addAdditionalEmailStruct()">+ AGREGAR CORREO</button></div><div class="noti-toolbar"><button type="button" class="secondary" onclick="useRegisteredEmailStruct()">AUTOCOMPLETAR DESDE REGISTRO</button><button type="button" class="secondary" onclick="copyNotificationStruct()">COPIAR CORREO</button><button type="button" class="notif-primary" onclick="openInstitutionalMailStruct()">NOTIFICAR</button></div><div class="noti-preview"><div id="emailSubjectStruct" class="noti-subject">Asunto: ${h(e.subject)}</div><div id="emailBodyStruct">${h(e.body)}</div></div><div class="noti-note">NOTIFICAR abre el correo institucional con destinatarios, asunto y cuerpo precargados. Adjunte manualmente el informe firmado antes de enviar.</div></section><section class="noti-card"><div class="noti-title">2. SIENTO RAZÓN eGOB</div><div class="field"><label>RESPALDOS DE NOTIFICACIÓN POR CORREO (PDF) *</label><input type="file" accept="application/pdf,.pdf" multiple onchange="selectNotificationPdfsStruct(this)">${backupStatusStruct()}</div><div class="siento-preview"><strong id="sientoTitleStruct">${h(sr.title)}</strong><br><br><span id="sientoTextStruct">${h(sr.text)}</span></div><div class="noti-toolbar"><button type="button" class="notif-pdf" onclick="generateSientoPdfStruct()">GENERAR PDF</button></div></section></div>`}
function updateTabs(){
 const allowed=tabsStruct();document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('hidden',!allowed.includes(b.dataset.tab)));const cur=document.querySelector('.tab.active')?.id;if(!allowed.includes(cur))showTab('tab-info');syncSidebarStruct();if(state.tipo==='OBSERVACIONES'){renderStructCatalog();renderStructSelected();renderNotificationStruct()}if(state.tipo==='DESISTIMIENTO')renderDesObservationInfo();renderVista();
}
function showTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab-btn').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='tab-vista')renderVista();if(id==='tab-obs'){renderStructCatalog();renderStructSelected()}if(id==='tab-notif')renderNotificationStruct()}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b&&!b.classList.contains('hidden'))showTab(b.dataset.tab)});
$('tipoInforme').addEventListener('change',()=>{state.tipo=$('tipoInforme').value;saveLocal();updateTabs()});
$('fechaIngresoTop').addEventListener('change',()=>{state.info.fechaIngresoTramite=$('fechaIngresoTop').value;saveLocal()});
$('fechaRevisionTop').addEventListener('change',()=>{state.info.fechaInforme=$('fechaRevisionTop').value||today();state.fecha=state.info.fechaInforme;state.info.fechaSubsanacion=addBusinessDays(state.fecha,10);$('fechaSubsanacionTop').value=state.info.fechaSubsanacion;saveLocal();renderVista();renderNotificationStruct()});
$('fechaSubsanacionTop').addEventListener('change',()=>{state.info.fechaSubsanacion=$('fechaSubsanacionTop').value;saveLocal();renderVista();renderNotificationStruct();renderStructCatalog()});
$('obsBuscarReq').addEventListener('input',renderStructCatalog);
$('obsNota').addEventListener('input',()=>{state.obsNota=$('obsNota').value;saveLocal();renderVista()});
$('desMotivo').addEventListener('change',()=>{state.des.motivo=normalizeDesMotivoStruct($('desMotivo').value);if(state.des.motivo==='Petición del Administrado')state.des.conclusiones='';$('desMotivo').value=state.des.motivo;$('desConclusiones').value=state.des.conclusiones||'';saveLocal();renderDesObservationInfo();renderVista()});$('desNota').addEventListener('input',()=>{state.des.nota=$('desNota').value;saveLocal();renderVista()});$('desConclusiones').addEventListener('input',()=>{state.des.conclusiones=$('desConclusiones').value;saveLocal();renderVista()});$('egobTop').addEventListener('input',()=>{if(!manualMode)return;state.info.egob=$('egobTop').value.replace(/\D/g,'');$('egobTop').value=state.info.egob;saveLocal();renderInfo();renderVista()});
async function auth(){const {data:{session}}=await sb.auth.getSession();if(!session?.user){location.replace('../index.html');return false}const {data,error}=await sb.from('phdu_profiles').select('id,correo,nombre_completo,rol,activo,cargo,firma_nombre,firma_cargo').eq('id',session.user.id).single();if(error)throw error;const role=upper(data?.rol);if(!data?.activo||!['INGENIERO_CIVIL','ADMIN'].includes(role)){location.replace('../index.html');return false}profile=data;return true}
async function loadPreviousObservationStruct(solicitudId){previousObservationState=null;if(!solicitudId||solicitudId==='MANUAL')return;try{const {data,error}=await sb.from('phdu_informes_estructurales').select('datos_informe,fecha_informe,creado_en,finalizado_en').eq('solicitud_id',solicitudId).eq('tipo_informe','OBSERVACIONES').eq('estado','FINALIZADO').order('finalizado_en',{ascending:false,nullsFirst:false}).order('creado_en',{ascending:false}).limit(1).maybeSingle();if(error)throw error;if(data?.datos_informe&&typeof data.datos_informe==='object')previousObservationState=data.datos_informe}catch(e){console.warn('No se pudo recuperar el último informe de observaciones estructurales',e)}}
async function init(){try{if(!await auth())return;const params=new URLSearchParams(location.search),id=params.get('solicitud'),nuevo=params.get('nuevo')==='1';if(nuevo){manualMode=true;request={id:'MANUAL',egob:'',estado_revision:'EN_REVISION',datos_solicitud:{origen:'MANUAL_INGENIERIA'},anexos:[]};initState();$('egobTop').readOnly=false;$('estadoTop').value='EN_REVISION';$('ingenieroTop').value=profile.firma_nombre||profile.nombre_completo||profile.correo||''}else{if(!id)throw new Error('No se recibió una solicitud estructural.');const {data,error}=await sb.from('phdu_solicitudes_revision_estructural').select('*').eq('id',id).single();if(error)throw error;request=data;if(request.estado_revision==='PENDIENTE'){await sb.from('phdu_solicitudes_revision_estructural').update({estado_revision:'EN_REVISION'}).eq('id',request.id);request.estado_revision='EN_REVISION'}initState();$('estadoTop').value=request.estado_revision||'';$('ingenieroTop').value=profile.firma_nombre||profile.nombre_completo||profile.correo||'';await loadPreviousObservationStruct(request.id)}ensureStructObservationState();catalogs.menor=await loadCSV('data/checklist_estructural_hasta_2_pisos_400m2.csv');catalogs.mayor=await loadCSV('data/checklist_estructural_mas_2_pisos_400m2.csv');migrateOldReqObservationsStruct();renderInfo();syncSidebarStruct();renderStructCatalog();renderStructSelected();renderAprFields();$('obsNota').value=state.obsNota||'';state.des.motivo=normalizeDesMotivoStruct(state.des.motivo||'');$('desMotivo').value=state.des.motivo||'';$('desNota').value=state.des.nota||'';$('desConclusiones').value=state.des.conclusiones||'';updateTabs();renderDesObservationInfo();setStatus(manualMode?'Nuevo informe estructural listo para completar.':'Solicitud cargada correctamente.','ok');loadProfessionalEmailsStruct().then(()=>{const n=ensureNotificationStruct(),found=lookupProjectEmailStruct();if(found&&!n.correo){n.correo=found;n.correoAuto=found;n.correoManual=false;saveLocal();renderNotificationStruct()}}).catch(()=>{})}catch(e){setStatus(e.message||String(e),'error');console.error(e)}}
init();
</script>
