<body>
<header class="no-print"><div class="brand">ALLPA · REVISIÓN ESTRUCTURAL<small>OBRA MAYOR DEFINITIVO</small></div><div class="head-actions"><button class="btn btn-white" onclick="history.back()">VOLVER</button></div></header>
<main>

    <div class="field"><label>Ingeniero Civil</label><input id="ingenieroTop" readonly></div>

  <div id="checklistReq"></div>

</section>

<section id="tab-vista" class="tab card"><div id="vista"></div></section>
<div id="status" class="statusbar no-print">Cargando solicitud...</div>
</main>
<script>
const SUPABASE_URL='https://lfinvpmobnczgtabtwfs.supabase.co';
const SUPABASE_KEY='sb_publishable_oARH0ZQa0_d8w_dkYYd1dw_NlWSUn9i';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'allpa-phdu-auth-v1'}});
const $=id=>document.getElementById(id);const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const clean=v=>String(v??'').trim();const upper=v=>clean(v).toUpperCase();const today=()=>new Date().toISOString().slice(0,10);const fmt=v=>{if(!v)return'';const p=String(v).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v};
let profile=null,request=null,catalogs={menor:[],mayor:[]};
let state={tipo:'',fecha:today(),info:{},requisitos:{MENOR:{},MAYOR:{}},obsConclusiones:'',recColumnas:false,anexos:[],des:{motivo:'',asunto:'',conclusiones:''}};
function setStatus(t,kind=''){const el=$('status');el.textContent=t;el.style.color=kind==='error'?'#9c2530':kind==='ok'?'#087947':''}
function splitCSVLine(line,sep=';'){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===sep&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
function parseCSV(txt){const lines=String(txt||'').replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const sep=lines[0].includes(';')?';':',';const head=splitCSVLine(lines[0],sep).map(clean);return lines.slice(1).map(l=>{const cells=splitCSVLine(l,sep),o={};head.forEach((k,i)=>o[k]=clean(cells[i]||''));return o}).filter(o=>Object.values(o).some(Boolean))}
async function loadCSV(path){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return parseCSV(await r.text())}catch(e){console.warn('Catálogo no cargado',path,e);return[]}}
function saveLocal(){try{localStorage.setItem('allpa-struct-'+request.id,JSON.stringify(state))}catch(e){}}
function restoreLocal(){try{const x=JSON.parse(localStorage.getItem('allpa-struct-'+request.id)||'null');if(x&&typeof x==='object')state={...state,...x,info:{...state.info,...(x.info||{})},requisitos:{MENOR:{...(state.requisitos?.MENOR||{}),...(x.requisitos?.MENOR||{})},MAYOR:{...(state.requisitos?.MAYOR||{}),...(x.requisitos?.MAYOR||{})}},anexos:Array.isArray(x.anexos)?x.anexos:[]}}catch(e){}}
function ownerText(){return clean(state.info.propietarios)}function ciText(){return clean(state.info.documentos)}
function initState(){
 const ds=request.datos_solicitud||{};state.info={
  egob:request.egob||'',propietarios:request.propietarios_texto||'',documentos:request.documentos_propietarios||'',proyecto:request.nombre_proyecto||'',uso:request.uso_proyecto||'',tipoObra:request.tipo_obra||'OBRA MAYOR - DEFINITIVO',pisos:request.pisos??request.altura_edificacion??'',areaConstruccion:request.area_construccion??ds.area_construccion??'',parroquia:request.parroquia||'',direccion:request.direccion||'',pit:request.codigo_pit||'',clave:request.clave_catastral||'',proyectista:request.proyectista||'',proyectistaSenescyt:request.proyectista_senescyt||'',arquitecto:request.arquitecto_nombre||'',arquitectoCargo:request.arquitecto_cargo||'',memorando:request.memorando_solicitud||'',calculista:request.calculista||'',calculistaSenescyt:request.calculista_senescyt||''
 };
 state.anexos=Array.isArray(request.anexos)&&request.anexos.length?request.anexos:(Array.isArray(ds.anexos_detalle)?ds.anexos_detalle:[]);
 if(!state.anexos.length)state.anexos=[{tipo:'folder',fojas:'',incluyePlanos:false,planos:'',incluyeCds:false,cds:''}];
 state.des.asunto=`INFORME TÉCNICO DE DESISTIMIENTO - REVISIÓN ESTRUCTURAL TRÁMITE ${request.egob||''}`;
 restoreLocal();
}
function infoField(id,label,span=1){return `<div class="field ${span===2?'span2':span===3?'span3':''}"><label>${h(label)}</label><input data-info="${h(id)}" value="${h(state.info[id]||'')}"></div>`}
function renderInfo(){
 $('infoGrid').innerHTML=[infoField('egob','eGOB'),infoField('propietarios','Propietario(s)'),infoField('documentos','CI/RUC'),infoField('proyecto','Nombre del proyecto',2),infoField('uso','Uso principal'),infoField('tipoObra','Tipo de obra'),infoField('pisos','Altura / pisos'),infoField('areaConstruccion','Área de construcción (m²)'),infoField('parroquia','Parroquia'),infoField('direccion','Dirección',2),infoField('pit','Código PIT'),infoField('clave','Clave catastral',2),infoField('proyectista','Proyectista'),infoField('proyectistaSenescyt','REG. SENESCYT Proyectista'),infoField('arquitecto','Técnico que solicita'),infoField('arquitectoCargo','Cargo técnico solicitante'),infoField('memorando','Memorando de Solicitud Estructural'),infoField('calculista','Ing. Calculista'),infoField('calculistaSenescyt','REG. SENESCYT Calculista')].join('');
 document.querySelectorAll('[data-info]').forEach(el=>el.addEventListener('input',()=>{state.info[el.dataset.info]=el.value;saveLocal();if(['pisos','areaConstruccion'].includes(el.dataset.info))renderRequirements();renderVista()}));
}
function numberValue(v){const n=Number(String(v??'').replace(',','.').replace(/[^\d.-]/g,''));return Number.isFinite(n)?n:0}
function checklistKey(){const pisos=numberValue(state.info.pisos),area=numberValue(state.info.areaConstruccion);return (pisos>2||area>400)?'MAYOR':'MENOR'}
function checklistRows(){return checklistKey()==='MAYOR'?catalogs.mayor:catalogs.menor}
function reqObj(key,id){if(!state.requisitos[key])state.requisitos[key]={};if(!state.requisitos[key][id])state.requisitos[key][id]={estado:'',observacion:''};return state.requisitos[key][id]}
function renderRequirements(){
 const key=checklistKey(),rows=checklistRows(),box=$('checklistReq'),msg=$('checklistMsg');
 const pisos=clean(state.info.pisos)||'—',area=clean(state.info.areaConstruccion)||'—';
 const label=key==='MAYOR'?'MÁS DE 2 PISOS O MÁS DE 400 m²':'HASTA 2 PISOS Y HASTA 400 m²';
 msg.innerHTML=`<span class="checklist-badge">${h(label)}</span><br>Checklist seleccionado automáticamente según <strong>${h(pisos)} piso(s)</strong> y <strong>${h(area)} m²</strong> de área de construcción.`;
 if(!rows.length){box.innerHTML='<div class="note">No se pudo cargar el checklist estructural correspondiente.</div>';return}
 let n=0;
 const body=rows.map(r=>{
   if(upper(r.Tipo)==='SECCION'){
     const nota=clean(r.Norma)?` <span style="font-weight:600;text-transform:none">· ${h(r.Norma)}</span>`:'';
     return `<tr class="req-section"><td colspan="5">${h(r.Requisito||r.Grupo||'')}${nota}</td></tr>`;
   }
   n++;
   const id=r.ID||`${key}_${n}`,x=reqObj(key,id);
   return `<tr><td>${n}</td><td><strong>${h(r.Grupo||'')}</strong><br>${h(r.Requisito||'')}</td><td>${h(r.Norma||'')}</td><td><select data-req-key="${key}" data-req-id="${h(id)}"><option></option><option ${x.estado==='Cumple'?'selected':''}>Cumple</option><option ${x.estado==='No Cumple'?'selected':''}>No Cumple</option><option ${x.estado==='No Aplica'?'selected':''}>No Aplica</option></select></td><td><textarea data-reqobs-key="${key}" data-reqobs-id="${h(id)}" placeholder="Observación técnica">${h(x.observacion||'')}</textarea></td></tr>`;
 }).join('');
 box.innerHTML=`<div class="req-wrap"><table class="req-table"><thead><tr><th>Nro.</th><th>Requisito</th><th>Norma / Referencia</th><th>Estado</th><th>Observación</th></tr></thead><tbody>${body}</tbody></table></div>`;
 box.querySelectorAll('[data-req-key]').forEach(el=>el.addEventListener('change',()=>{reqObj(el.dataset.reqKey,el.dataset.reqId).estado=el.value;saveLocal();renderVista()}));
 box.querySelectorAll('[data-reqobs-key]').forEach(el=>el.addEventListener('input',()=>{reqObj(el.dataset.reqobsKey,el.dataset.reqobsId).observacion=el.value;saveLocal();renderVista()}));
}
function annexN(index,type){let n=0;for(let i=0;i<=index;i++)if((state.anexos[i]?.tipo||'folder')===type)n++;return n}
function annexLine(r,i){const tipo=r.tipo||'folder';const f=clean(r.fojas);let s=tipo==='carpeta'?`Carpeta ${annexN(i,'carpeta')}: ${f} fojas`:tipo==='fojas'?`${f} fojas`:`Folder ${annexN(i,'folder')}: ${f} fojas`;if(r.incluyePlanos)s+=` incluido ${clean(r.planos)} ${Number(r.planos)===1?'plano':'planos'}`;s+=' en su foliado';if(r.incluyeCds)s+=` + ${clean(r.cds)} ${Number(r.cds)===1?'CD':'CDs'}`;return s}
function renderAnnex(){const rows=state.anexos;$('annexForm').innerHTML=`<div class="req-wrap"><table class="annex-table"><thead><tr><th>Numeración</th><th>Tipo</th><th>N.º de fojas</th><th>Planos incluidos</th><th>Agregar CDs</th><th>N.º de CDs</th><th>Acción</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${r.tipo==='carpeta'?'Carpeta '+annexN(i,'carpeta'):r.tipo==='fojas'?'Fojas':'Folder '+annexN(i,'folder')}</td><td><select data-ax="${i}" data-f="tipo"><option value="folder" ${r.tipo==='folder'?'selected':''}>folder</option><option value="carpeta" ${r.tipo==='carpeta'?'selected':''}>carpeta</option><option value="fojas" ${r.tipo==='fojas'?'selected':''}>fojas</option></select></td><td><input data-ax="${i}" data-f="fojas" value="${h(r.fojas||'')}" placeholder="Fojas"></td><td><label class="inline-check"><input type="checkbox" data-ax="${i}" data-f="incluyePlanos" ${r.incluyePlanos?'checked':''}> incluido</label><input data-ax="${i}" data-f="planos" value="${h(r.planos||'')}" placeholder="N.º" ${r.incluyePlanos?'':'disabled'}></td><td><label class="inline-check"><input type="checkbox" data-ax="${i}" data-f="incluyeCds" ${r.incluyeCds?'checked':''}> + CDs</label></td><td><input data-ax="${i}" data-f="cds" value="${h(r.cds||'')}" placeholder="CDs" ${r.incluyeCds?'':'disabled'}></td><td><button class="danger-small" onclick="removeAnnex(${i})">QUITAR</button></td></tr>`).join('')}</tbody></table></div><div class="toolbar"><button class="btn btn-blue" onclick="addAnnex()">+ AGREGAR FILA</button></div>`;document.querySelectorAll('[data-ax]').forEach(el=>{const ev=(el.type==='checkbox'||el.tagName==='SELECT')?'change':'input';el.addEventListener(ev,()=>{const r=state.anexos[Number(el.dataset.ax)],f=el.dataset.f;r[f]=el.type==='checkbox'?el.checked:el.value;if(f==='incluyePlanos'&&!r[f])r.planos='';if(f==='incluyeCds'&&!r[f])r.cds='';saveLocal();if(el.type==='checkbox'||el.tagName==='SELECT')renderAnnex();renderVista()})})}
window.addAnnex=()=>{state.anexos.push({tipo:'folder',fojas:'',incluyePlanos:false,planos:'',incluyeCds:false,cds:''});saveLocal();renderAnnex();renderVista()};window.removeAnnex=i=>{if(state.anexos.length===1)return alert('Debe conservar al menos una fila.');state.anexos.splice(i,1);saveLocal();renderAnnex();renderVista()};
function renderAprFields(){$('aprFields').innerHTML=infoField('memorando','Memorando de Solicitud Estructural')+infoField('arquitecto','Técnico que registra la solicitud')+infoField('arquitectoCargo','Cargo del técnico solicitante')+infoField('egob','eGOB')+infoField('propietarios','Propietario(s)')+infoField('documentos','CI/RUC')+infoField('calculista','Ing. Calculista')+infoField('calculistaSenescyt','REG. SENESCYT Calculista');$('aprFields').querySelectorAll('[data-info]').forEach(el=>el.addEventListener('input',()=>{state.info[el.dataset.info]=el.value;saveLocal();renderInfo();renderVista()}));$('recColumnas').checked=!!state.recColumnas;$('recColumnas').onchange=()=>{state.recColumnas=$('recColumnas').checked;saveLocal();renderVista()};renderAnnex()}
function selectedObservations(){const key=checklistKey(),out=[];let n=0;for(const r of checklistRows()){if(upper(r.Tipo)==='SECCION')continue;n++;const id=r.ID||`${key}_${n}`,x=state.requisitos?.[key]?.[id];if(x?.estado==='No Cumple')out.push({grupo:r.Grupo||'',requisito:r.Requisito||'',observacion:x.observacion||'',norma:r.Norma||''})}return out}
function antecedenteObs(){return `En atención al trámite E-GOB Nro. ${state.info.egob||''}, correspondiente a ${state.info.tipoObra||'OBRA MAYOR - DEFINITIVO'}${state.info.proyecto?`, proyecto ${state.info.proyecto}`:''}${state.info.propietarios?`, de propiedad de ${state.info.propietarios}`:''}; una vez realizada la Revisión Estructural solicitada, debo indicar lo siguiente.`}
function reportObservaciones(){const obs=selectedObservations();return `<div class="report-shell" id="printReport"><h1>INFORME TÉCNICO DE OBSERVACIONES · REVISIÓN ESTRUCTURAL</h1><h2>Antecedentes</h2><p>${h(antecedenteObs())}</p><h2>Criterio técnico</h2>${obs.length?`<table class="report-table"><thead><tr><th>Nro.</th><th>Componente</th><th>Requisito observado</th><th>Norma / Referencia</th><th>Observación</th></tr></thead><tbody>${obs.map((o,i)=>`<tr><td>${i+1}</td><td>${h(o.grupo)}</td><td>${h(o.requisito)}</td><td>${h(o.norma)}</td><td>${h(o.observacion||'')}</td></tr>`).join('')}</tbody></table>`:'<p>No se registran requisitos marcados como No Cumple.</p>'}<h2>Base legal</h2>${[...new Set(obs.map(x=>x.norma).filter(Boolean))].map(x=>`<p>${h(x)}</p>`).join('')||'<p>La referencia normativa consta en los requisitos técnicos revisados.</p>'}<h2>Conclusiones</h2><p>${h(state.obsConclusiones||'')}</p><div class="signature"><p>Atentamente,</p><div class="signature-space"></div><p><strong>${h(profile?.firma_nombre||profile?.nombre_completo||'')}</strong><br>${h(profile?.firma_cargo||profile?.cargo||'')}</p></div></div>`}
function aprobatorioSubject(){return 'RESPUESTA A SOLICITUD DE REVISIÓN ESTRUCTURAL.'}
function aprobatorioBody(){const i=state.info;const rec1=state.recColumnas?'<li>Se sugiere revisar secciones de columnas de acuerdo al cálculo estructural.</li>':'';return `<p>De mi consideración. -</p><p>En referencia al memorando <strong>${h(i.memorando||'')}</strong>, suscrito por la <strong>${h(i.arquitecto||'')}</strong> <strong>${h(i.arquitectoCargo||'')}</strong>, correspondiente al trámite <strong>E-GOB</strong> Nro. <strong>${h(i.egob||'')}</strong>, del PROYECTO de propiedad del Sr(a). <strong>${h(i.propietarios||'')}</strong> con <strong>${h(i.documentos||'')}</strong>; me permito informar lo siguiente:</p><ul><li>El proyecto Técnico Estructural cumple con los requerimientos indicados en los capítulos correspondientes de la Norma Ecuatoriana de la Construcción (NEC-2015, ACI 318-19 y AISC 360-16)</li><li>Toda la información y datos contenidos en el proyecto son de absoluta responsabilidad del Ingeniero Calculista, en el caso de existir datos erróneos u ocultos, la aprobación quedará automáticamente insubsistente.</li></ul><h3>CONCLUSIÓN</h3><p>Una vez realizada la revisión estructural solicitada, se emite <strong>CRITERIO TÉCNICO FAVORABLE</strong>, en lo referente al Cálculo y diseño estructural bajo firma de responsabilidad del <strong>Ingeniero Calculista. ${h(i.calculista||'')}</strong>, Registro Senescyt <strong>${h(i.calculistaSenescyt||'')}</strong></p><h3>RECOMENDACIONES</h3><ul>${rec1}<li><strong>En el sitio de la obra deberá permanecer una copia de los planos y memoria aprobados.</strong></li><li>Cumplir con lo indicado en la <strong>ORDENANZA MUNICIPAL Nro. 016-2023 QUE CONTIENE LA ACTUALIZACIÓN CÓDIGO URBANO PARA EL CANTÓN RIOBAMBA</strong></li><li>Reglamento de seguridad y salud para la construcción y Obras Públicas publicado en SUPLEMENTO R. O. NO. 249, de fecha 10 de enero de 2008 y su reforma en Registro Oficial N° 13 de fecha 13 de junio de 2017</li></ul><p>En especial con lo siguiente:</p><p class="ordinance">“ORDENANZA MUNICIPAL Nro. 016-2023 QUE CONTIENE LA ACTUALIZACIÓN CÓDIGO URBANO PARA EL CANTÓN RIOBAMBA”<br>LIBRO I “DE LA HABILITACIÓN DEL SUELO, EDIFICACIÓN, PROPIEDAD HORIZONTAL, INSTALACIÓN O CONSTRUCCIÓN DE ESTRUCTURAS FIJAS DE SOPORTE PARA EL SERVICIO MÓVIL AVANZADO Y SU CONTROL”<br>DE LOS PROFESIONALES RESPONSABLES EN LAS LICENCIAS Y AUTORIZACIONES URBANÍSTICAS.</p><p class="article-lines">Artículo 131. Planificación y Construcción de Obras Licenciadas o Autorizadas.<br>Artículo 132. Ámbito de Competencia Profesional.<br>Artículo 133. Sujeción a las reglas técnicas y normas administrativas.<br>Artículo 134. Dirección técnica.<br>Artículo 135. Identificación del proyecto y profesionales responsables de la obra.<br>Artículo 136. Responsabilidad de las obras.<br>Artículo 137. Autorización para modificaciones a los proyectos.<br>Artículo 138. De las obligaciones durante el proceso de construcción.<br>Artículo 139. Incumplimiento en obras.<br><br><strong>CONTROL PARA HABILITACIÓN DE SUELO Y EDIFICACIÓN</strong><br><br>Artículo 140. Control para habilitación de suelo y edificación<br>Artículo 141. Controles aleatorios.<br>Artículo 142. Controles programados.<br>Artículo 143. Notificación de inicio y realización de obras para controles programados.<br>Artículo 144. Requisitos para la finalización de Obras.<br>Artículo 145. Procedimiento para la Finalización de Obras.<br>Artículo 146. Informe Aprobatorio de Finalización de la habilitación o edificación de obra mayor.<br>Artículo 147. Características del Informe Aprobatorio de Finalización de la Edificación.<br>Artículo 148. Características del Informe Aprobatorio de Finalización de Habilitación de Suelo.</p>`}
function annexHtml(){return state.anexos.map((r,i)=>`<p>${h(annexLine(r,i))}</p>`).join('')}
function desistSubject(){return clean(state.des.asunto)||`INFORME TÉCNICO DE DESISTIMIENTO - REVISIÓN ESTRUCTURAL TRÁMITE ${state.info.egob||''}`}
function desistBody(){const m=state.des.motivo,c=clean(state.des.conclusiones);let body=`<p>En referencia a la revisión estructural correspondiente al trámite <strong>E-GOB Nro. ${h(state.info.egob||'')}</strong>, de propiedad de <strong>${h(state.info.propietarios||'')}</strong>, me permito informar lo siguiente:</p>`;if(m==='Por Petición del Administrado')body+=`<p><strong>CÓDIGO ORGÁNICO ADMINISTRATIVO</strong><br>Art. 211.- Desistimiento. La persona interesada puede desistir del procedimiento cuando no esté prohibido por la ley. Debe indicarse expresamente si se trata de un desistimiento total o parcial.</p><h3>CONCLUSIÓN</h3><p>En base al Artículo 211 del COA, por Petición del Administrado se procede con el Desistimiento del Trámite.</p><h3>RECOMENDACIÓN</h3><p>Se recomienda remitir el presente trámite para la emisión de la Resolución Administrativa correspondiente.</p>`;else body+=`<p>Luego de la revisión de las observaciones estructurales notificadas, corresponde registrar el motivo: <strong>${h(m||'')}</strong>.</p><h3>CONCLUSIONES</h3><p>Por las conclusiones antes expuestas se emite criterio técnico <strong>NO FAVORABLE</strong>${c?', '+h(c):'.'}</p>`;return body}
async function richCopy(html,plain){if(navigator.clipboard?.write&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain||html.replace(/<[^>]+>/g,' ')],{type:'text/plain'})})]);return}const d=document.createElement('div');d.contentEditable='true';d.style.position='fixed';d.style.left='-9999px';d.innerHTML=html;document.body.appendChild(d);const r=document.createRange();r.selectNodeContents(d);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();d.remove()}
async function copyBlock(kind){try{if(kind==='obs')return await richCopy(reportObservaciones(),$('printReport')?.innerText||'');if(kind==='aprSub')return await richCopy(`<span style="font-family:Arial;font-size:11pt">${h(aprobatorioSubject())}</span>`,aprobatorioSubject());if(kind==='aprBody')return await richCopy(`<div style="font-family:Arial;font-size:11pt">${aprobatorioBody()}</div>`,'');if(kind==='aprAx')return await richCopy(`<div style="font-family:Arial;font-size:11pt">${annexHtml()}</div>`,'');if(kind==='desSub')return await richCopy(`<span style="font-family:Arial;font-size:11pt">${h(desistSubject())}</span>`,desistSubject());if(kind==='desBody')return await richCopy(`<div style="font-family:Arial;font-size:11pt">${desistBody()}</div>`,'');}catch(e){alert('No se pudo copiar: '+e.message)}setStatus('Contenido copiado.', 'ok')}
window.copyBlock=copyBlock;
function renderVista(){const t=state.tipo;const box=$('vista');if(!t){box.innerHTML='<div class="note">Seleccione el tipo de informe para generar la vista.</div>';return}if(t==='OBSERVACIONES'){box.innerHTML=`<div class="toolbar no-print"><button class="btn btn-blue" onclick="copyBlock('obs')">COPIAR</button><button class="btn btn-outline" onclick="window.print()">PDF</button><button class="btn btn-green" onclick="finalizeReport()">REGISTRAR INFORME</button></div>${reportObservaciones()}`;return}if(t==='APROBATORIO'){box.innerHTML=`<div class="memo-panel"><div class="copy-card"><div class="copy-head"><strong>ASUNTO</strong><button class="btn btn-outline" onclick="copyBlock('aprSub')">COPIAR ASUNTO</button></div><div class="copy-body">${h(aprobatorioSubject())}</div></div><div class="copy-card"><div class="copy-head"><strong>CUERPO</strong><button class="btn btn-outline" onclick="copyBlock('aprBody')">COPIAR CUERPO</button></div><div class="copy-body">${aprobatorioBody()}</div></div><div class="copy-card"><div class="copy-head"><strong>ANEXOS</strong><button class="btn btn-outline" onclick="copyBlock('aprAx')">COPIAR ANEXOS</button></div><div class="copy-body">${annexHtml()}</div></div><button class="btn btn-green" onclick="finalizeReport()">REGISTRAR INFORME APROBATORIO</button></div>`;return}box.innerHTML=`<div class="memo-panel"><div class="copy-card"><div class="copy-head"><strong>ASUNTO</strong><button class="btn btn-outline" onclick="copyBlock('desSub')">COPIAR ASUNTO</button></div><div class="copy-body">${h(desistSubject())}</div></div><div class="copy-card"><div class="copy-head"><strong>CUERPO</strong><button class="btn btn-outline" onclick="copyBlock('desBody')">COPIAR CUERPO</button></div><div class="copy-body">${desistBody()}</div></div><button class="btn btn-green" onclick="finalizeReport()">REGISTRAR INFORME DE DESISTIMIENTO</button></div>`}
function validate(){const e=[];if(!state.tipo)e.push('Seleccione el tipo de informe.');if(!clean(state.info.egob))e.push('Falta eGOB.');if(state.tipo==='OBSERVACIONES'){if(!selectedObservations().length)e.push('Registre al menos una observación estructural.');if(!clean(state.obsConclusiones))e.push('Complete las conclusiones.')}if(state.tipo==='APROBATORIO'){[['Memorando de Solicitud',state.info.memorando],['Técnico solicitante',state.info.arquitecto],['Cargo técnico solicitante',state.info.arquitectoCargo],['Propietario(s)',state.info.propietarios],['CI/RUC',state.info.documentos],['Ing. Calculista',state.info.calculista],['REG. SENESCYT Calculista',state.info.calculistaSenescyt]].forEach(([l,v])=>{if(!clean(v))e.push('Falta '+l+'.')});state.anexos.forEach((r,i)=>{if(!clean(r.fojas))e.push(`Falta número de fojas en anexo ${i+1}.`);if(r.incluyePlanos&&!clean(r.planos))e.push(`Falta número de planos en anexo ${i+1}.`);if(r.incluyeCds&&!clean(r.cds))e.push(`Falta número de CDs en anexo ${i+1}.`)})}if(state.tipo==='DESISTIMIENTO'&&!clean(state.des.motivo))e.push('Seleccione el motivo de desistimiento.');return e}
async function finalizeReport(){const e=validate();if(e.length)return alert('No se puede registrar todavía:\n\n- '+e.join('\n- '));if(!confirm('¿Registrar este Informe Estructural como FINALIZADO?'))return;const rendered=state.tipo==='OBSERVACIONES'?{informe_html:reportObservaciones()}:(state.tipo==='APROBATORIO'?{asunto:aprobatorioSubject(),cuerpo_html:aprobatorioBody(),anexos_html:annexHtml()}:{asunto:desistSubject(),cuerpo_html:desistBody()});const payload={solicitud_id:request.id,tipo_informe:state.tipo,estado:'FINALIZADO',fecha_informe:state.fecha,memorando_solicitud:state.info.memorando||'',calculista:state.info.calculista||'',calculista_senescyt:state.info.calculistaSenescyt||'',anexos:state.anexos,datos_informe:state,bloques_renderizados:rendered};setStatus('Registrando informe estructural...');const {data,error}=await sb.rpc('phdu_guardar_informe_estructural',{p_payload:payload});if(error){setStatus(error.message||String(error),'error');return alert(error.message||error)}const row=Array.isArray(data)?data[0]:data;setStatus(`Informe registrado. Estado estructural: ${row?.estado_revision||''}`,'ok');$('estadoTop').value=row?.estado_revision||$('estadoTop').value;localStorage.removeItem('allpa-struct-'+request.id);setTimeout(()=>location.href='index.html',700)}
window.finalizeReport=finalizeReport;
function updateTabs(){const t=state.tipo;const allowed=t==='OBSERVACIONES'?['tab-info','tab-req','tab-vista']:t==='APROBATORIO'?['tab-info','tab-apr','tab-vista']:t==='DESISTIMIENTO'?['tab-info','tab-des','tab-vista']:['tab-info','tab-vista'];document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('hidden',!allowed.includes(b.dataset.tab)));const cur=document.querySelector('.tab.active')?.id;if(!allowed.includes(cur))showTab('tab-info');if(t==='OBSERVACIONES')renderRequirements();renderVista()}
function showTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab-btn').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='tab-vista')renderVista()}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b&&!b.classList.contains('hidden'))showTab(b.dataset.tab)});
$('tipoInforme').addEventListener('change',()=>{state.tipo=$('tipoInforme').value;saveLocal();updateTabs()});$('obsConclusiones').addEventListener('input',()=>{state.obsConclusiones=$('obsConclusiones').value;saveLocal();renderVista()});$('desMotivo').addEventListener('change',()=>{state.des.motivo=$('desMotivo').value;saveLocal();renderVista()});$('desAsunto').addEventListener('input',()=>{state.des.asunto=$('desAsunto').value;saveLocal();renderVista()});$('desConclusiones').addEventListener('input',()=>{state.des.conclusiones=$('desConclusiones').value;saveLocal();renderVista()});
async function auth(){const {data:{session}}=await sb.auth.getSession();if(!session?.user){location.replace('../index.html');return false}const {data,error}=await sb.from('phdu_profiles').select('id,correo,nombre_completo,rol,activo,cargo,firma_nombre,firma_cargo').eq('id',session.user.id).single();if(error)throw error;const role=upper(data?.rol);if(!data?.activo||!['INGENIERO_CIVIL','ADMIN'].includes(role)){location.replace('../index.html');return false}profile=data;return true}
async function init(){try{if(!await auth())return;const id=new URLSearchParams(location.search).get('solicitud');if(!id)throw new Error('No se recibió una solicitud estructural.');const {data,error}=await sb.from('phdu_solicitudes_revision_estructural').select('*').eq('id',id).single();if(error)throw error;request=data;if(request.estado_revision==='PENDIENTE'){await sb.from('phdu_solicitudes_revision_estructural').update({estado_revision:'EN_REVISION'}).eq('id',request.id);request.estado_revision='EN_REVISION'}initState();$('egobTop').value=request.egob||'';$('estadoTop').value=request.estado_revision||'';$('ingenieroTop').value=profile.firma_nombre||profile.nombre_completo||profile.correo||'';$('tipoInforme').value=state.tipo||'';catalogs.menor=await loadCSV('data/checklist_estructural_hasta_2_pisos_400m2.csv');catalogs.mayor=await loadCSV('data/checklist_estructural_mas_2_pisos_400m2.csv');renderInfo();renderRequirements();renderAprFields();$('obsConclusiones').value=state.obsConclusiones||'';$('desMotivo').value=state.des.motivo||'';$('desAsunto').value=state.des.asunto||'';$('desConclusiones').value=state.des.conclusiones||'';updateTabs();setStatus('Solicitud cargada correctamente.','ok')}catch(e){setStatus(e.message||String(e),'error');console.error(e)}}
init();
</script>
</body></html>
