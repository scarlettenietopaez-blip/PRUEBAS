function splitCSVLine(line,sep=';'){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===sep&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
function parseCSV(txt){const lines=String(txt||'').replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const sep=lines[0].includes(';')?';':',';const head=splitCSVLine(lines[0],sep).map(clean);return lines.slice(1).map(l=>{const cells=splitCSVLine(l,sep),o={};head.forEach((k,i)=>o[k]=clean(cells[i]||''));return o}).filter(o=>Object.values(o).some(Boolean))}
async function loadCSV(path){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return parseCSV(await r.text())}catch(e){console.warn('Catálogo no cargado',path,e);return[]}}

function numberValue(v){const n=Number(String(v??'').replace(',','.').replace(/[^\d.-]/g,''));return Number.isFinite(n)?n:0}
function checklistKey(){const pisos=numberValue(state.info.pisos),area=numberValue(state.info.areaConstruccion);return (pisos>2||area>400)?'MAYOR':'MENOR'}
function structureLabel(code){return ({HORMIGON:'Estructura Hormigón Armado',ACERO:'Estructura de Acero',MIXTA:'Estructura Mixta'})[code]||''}
function baseChecklistRows(){return checklistKey()==='MAYOR'?catalogs.mayor:catalogs.menor}
function structureApplies(r){const raw=upper(r.Estructuras||'');if(!raw)return true;const code=upper(state.tipoEstructura);if(!code)return false;return raw.split('|').map(x=>x.trim()).includes(code)}
function conditionApplies(r){
 const c=upper(r.Condicion||'');if(!c)return true;
 const ctl=state.controles||{};
 if(c==='SISMO_REGULAR')return ctl.sismo==='REGULAR';
 if(c==='SISMO_IRREGULAR')return ctl.sismo==='IRREGULAR';
 if(c==='SISMO_ESENCIAL')return ctl.sismo==='ESENCIAL';
 if(c==='OTROS_ELEMENTOS')return !!ctl.otrosElementos;
 if(c==='LOSA_ALIVIANADA')return Array.isArray(ctl.losas)&&ctl.losas.includes('ALIVIANADA');
 if(c==='LOSA_DECK')return Array.isArray(ctl.losas)&&ctl.losas.includes('DECK');
 if(c==='LOSA_CUBIERTA')return Array.isArray(ctl.losas)&&ctl.losas.includes('CUBIERTA');
 if(c==='ESCALERAS_MEMORIA')return !!ctl.escalerasMemoria;
 if(c==='ESCALERAS_PLANOS')return !!ctl.escalerasPlanos;
 if(c==='MIXTA_COLUMNAS_ACERO')return upper(state.tipoEstructura)==='ACERO'||(upper(state.tipoEstructura)==='MIXTA'&&!!ctl.mixtaColumnasAcero);
 if(c==='MIXTA_VIGAS_ACERO')return upper(state.tipoEstructura)==='ACERO'||(upper(state.tipoEstructura)==='MIXTA'&&!!ctl.mixtaVigasAcero);
 return true
}
function checklistRows(){return baseChecklistRows().filter(r=>structureApplies(r)&&conditionApplies(r))}
function reqObj(key,id,r=null){
 if(!state.requisitos[key])state.requisitos[key]={};
 if(!state.requisitos[key][id]){const pre=clean(r?.Preseleccion||'');state.requisitos[key][id]={estado:['Cumple','No Cumple','No Aplica'].includes(pre)?pre:'',observacion:'',imagenes:[]};}
 const o=state.requisitos[key][id];
 if(!Array.isArray(o.imagenes))o.imagenes=o.imagen?[o.imagen]:[];
 o.imagenes=[...new Set(o.imagenes.filter(Boolean))];o.imagen=o.imagenes[0]||'';
 return o
}
function allowedStates(r){
 const hasNewSchema=Object.prototype.hasOwnProperty.call(r,'Opciones');
 const raw=upper(r.Opciones||'');
 if(raw)return raw.split('|').map(x=>x.trim()).filter(Boolean).map(x=>x==='NO_CUMPLE'?'No Cumple':x==='NO_APLICA'?'No Aplica':x==='CUMPLE'?'Cumple':x);
 if(hasNewSchema)return[];
 const fallback=['Cumple','No Cumple'];if(upper(r.PermiteNoAplica)==='SI')fallback.push('No Aplica');return fallback
}
function rowHasStatus(r){return allowedStates(r).some(x=>['Cumple','No Cumple','No Aplica'].includes(x))&&upper(r.Tipo)!=='CONTROL'}
function applyChecklistDefaults(key,rows){if(!state.defaultsAplicados)state.defaultsAplicados={MENOR:false,MAYOR:false};if(state.defaultsAplicados[key])return;for(const r of rows){if(!rowHasStatus(r))continue;const id=r.ID||'';if(!id)continue;const pre=clean(r.Preseleccion||'');const o=reqObj(key,id,r),states=allowedStates(r);if(o.estado&&!states.includes(o.estado))o.estado='';if(!o.estado&&states.includes(pre))o.estado=pre;}if(key==='MAYOR'&&!state.controles.sismo){const sr=rows.find(r=>upper(r.Control||'')==='SISMO_SELECTOR');const pre=upper(sr?.Preseleccion||'');if(pre==='REGULAR')state.controles.sismo='REGULAR';else if(pre==='IRREGULAR')state.controles.sismo='IRREGULAR';else if(['ESENCIAL','ESCENCIAL'].includes(pre))state.controles.sismo='ESENCIAL';}state.defaultsAplicados[key]=true;saveLocal();}
function controlHtml(r){
 const ctl=upper(r.Control||''),c=state.controles||{};
 if(!ctl)return'';
 if(ctl==='SISMO_SELECTOR'){
   const opts=[['REGULAR','Regular'],['IRREGULAR','Irregular'],['ESENCIAL','Esencial']];
   return `<div class="req-control-box"><strong>Seleccione:</strong>${opts.map(([v,l])=>`<label><input type="checkbox" ${c.sismo===v?'checked':''} onchange="setExclusiveControl('sismo','${v}',this.checked)"> ${l}</label>`).join('')}</div>`
 }
 if(ctl==='MIXTA_COLUMNAS_ACERO'){if(upper(state.tipoEstructura)!=='MIXTA')return'';return `<div class="req-control-box"><label><input type="checkbox" ${c.mixtaColumnasAcero?'checked':''} onchange="setBoolControl('mixtaColumnasAcero',this.checked)"> Desplegar requisitos de Columnas de Acero</label></div>`;}
 if(ctl==='MIXTA_VIGAS_ACERO'){if(upper(state.tipoEstructura)!=='MIXTA')return'';return `<div class="req-control-box"><label><input type="checkbox" ${c.mixtaVigasAcero?'checked':''} onchange="setBoolControl('mixtaVigasAcero',this.checked)"> Desplegar requisitos de Vigas de Acero</label></div>`;}
 if(ctl==='TOGGLE_OTROS_ELEMENTOS')return `<div class="req-control-box"><label><input type="checkbox" ${c.otrosElementos?'checked':''} onchange="setBoolControl('otrosElementos',this.checked)"> Mostrar requisitos de Otros Tipos de Elementos</label></div>`;
 if(ctl==='TOGGLE_ESCALERAS_MEMORIA')return `<div class="req-control-box"><label><input type="checkbox" ${c.escalerasMemoria?'checked':''} onchange="setBoolControl('escalerasMemoria',this.checked)"> El proyecto incluye escaleras</label></div>`;
 if(ctl==='TOGGLE_ESCALERAS_PLANOS')return `<div class="req-control-box"><label><input type="checkbox" ${c.escalerasPlanos?'checked':''} onchange="setBoolControl('escalerasPlanos',this.checked)"> Mostrar revisión de escaleras</label></div>`;
 if(ctl==='LOSA_SELECTOR'){
   const code=upper(state.tipoEstructura),opts=[];
   if(['HORMIGON','MIXTA'].includes(code))opts.push(['ALIVIANADA','Losa alivianada de hormigón armado']);
   if(['ACERO','MIXTA'].includes(code))opts.push(['DECK','Losa tipo DECK']);
   opts.push(['CUBIERTA','Cubierta metálica']);
   const selected=Array.isArray(c.losas)?c.losas:[];
   return `<div class="req-control-box"><strong>Tipo(s):</strong>${opts.map(([v,l])=>`<label><input type="checkbox" ${selected.includes(v)?'checked':''} onchange="toggleArrayControl('losas','${v}',this.checked)"> ${l}</label>`).join('')}</div>`
 }
 return''
}
window.setExclusiveControl=function(name,value,checked){if(!state.controles)state.controles={};state.controles[name]=checked?value:'';saveLocal();renderRequirements();renderVista()}
window.setBoolControl=function(name,checked){if(!state.controles)state.controles={};state.controles[name]=!!checked;saveLocal();renderRequirements();renderVista()}
window.toggleArrayControl=function(name,value,checked){if(!state.controles)state.controles={};const arr=Array.isArray(state.controles[name])?state.controles[name]:[];state.controles[name]=checked?[...new Set([...arr,value])]:arr.filter(x=>x!==value);saveLocal();renderRequirements();renderVista()}
function reqImageGallery(key,id,imgs){if(!imgs.length)return'';return `<div class="req-image-gallery">${imgs.map((src,i)=>`<div class="req-image-thumb"><img src="${h(src)}" alt="Imagen ${i+1}"><button type="button" onclick="removeReqImage('${key}','${id}',${i})">QUITAR ${i+1}</button></div>`).join('')}</div><button type="button" class="req-clear-images" onclick="clearReqImages('${key}','${id}')">QUITAR TODAS</button>`}
function reqImageTools(key,id,o){if(o.estado!=='No Cumple')return '<div class="req-disabled">Disponible al marcar No Cumple.</div>';return `<div class="req-image-tools"><input type="file" accept="image/*" multiple onchange="addReqImages('${key}','${id}',this.files);this.value=''"><div class="req-paste-zone" contenteditable="true" onpaste="pasteReqImages('${key}','${id}',event)">Pegar una o varias capturas aquí</div>${o.imagenes.length?`<span class="note">${o.imagenes.length} imagen(es)</span>`:''}${reqImageGallery(key,id,o.imagenes)}</div>`}
function renderRequirements(){
 const key=checklistKey(),all=baseChecklistRows(),box=$('checklistReq'),msg=$('checklistMsg');applyChecklistDefaults(key,all);const rows=checklistRows();
 const pisos=clean(state.info.pisos)||'—',area=clean(state.info.areaConstruccion)||'—';
 const label=key==='MAYOR'?'MÁS DE 2 PISOS O MÁS DE 400 m²':'HASTA 2 PISOS Y HASTA 400 m²';
 const estructura=structureLabel(state.tipoEstructura);
 msg.innerHTML=`<span class="checklist-badge">${h(label)}</span>${estructura?` <span class="checklist-badge">${h(estructura)}</span>`:''}<br>Checklist seleccionado automáticamente según <strong>${h(pisos)} piso(s)</strong> y <strong>${h(area)} m²</strong> de área de construcción.`;
 if(!all.length){box.innerHTML='<div class="note">No se pudo cargar el checklist estructural correspondiente.</div>';return}
 if(!state.tipoEstructura){box.innerHTML='<div class="alert">Seleccione el <strong>Tipo de Estructura del Proyecto</strong> para mostrar los requisitos aplicables.</div>';return}
 let n=0;
 const body=rows.map(r=>{
   const tipo=upper(r.Tipo||''),level=Number(r.Nivel||0),statusRow=rowHasStatus(r),ctrl=controlHtml(r);
   if(tipo==='CONTROL'){
     return `<tr class="req-control"><td colspan="6"><span class="req-heading-label">${h(r.Requisito||'')}</span>${ctrl}</td></tr>`;
   }
   if(!statusRow&&(tipo==='TITULO'||tipo==='SUBTITULO'||tipo==='SECCION')){
     const cls=tipo==='TITULO'?'req-title':level===1?'req-sub1':level===2?'req-sub2':level===3?'req-sub3':'req-section';
     return `<tr class="${cls}"><td colspan="6"><span class="req-heading-label">${h(r.Requisito||r.Grupo||'')}</span>${ctrl}</td></tr>`;
   }
   n++;
   const id=r.ID||`${key}_${n}`,x=reqObj(key,id,r),states=allowedStates(r),hasC=states.includes('Cumple'),hasNC=states.includes('No Cumple'),hasNA=states.includes('No Aplica');
   if(x.estado&&!states.includes(x.estado))x.estado='';
   const check=(st,enabled)=>`<td class="req-center">${enabled?`<input type="checkbox" aria-label="${st}" ${x.estado===st?'checked':''} onchange="setReqStatus('${key}','${id}','${st}',this.checked)">`:''}</td>`;
   const headingClass=tipo==='SUBTITULO'?`${level===1?'req-sub1':level===2?'req-sub2':level===3?'req-sub3':''} req-status-heading`.trim():'';
   const labelHtml=`${tipo==='SUBTITULO'?'<strong>':''}${h(r.Requisito||'')}${tipo==='SUBTITULO'?'</strong>':''}${ctrl}`;
   return `<tr class="${headingClass}"><td class="req-requirement-cell">${labelHtml}</td>${check('Cumple',hasC)}${check('No Cumple',hasNC)}${check('No Aplica',hasNA)}<td class="req-observation-cell"><textarea placeholder="Observación para el usuario" ${x.estado==='No Cumple'?'':'disabled'} oninput="updateReqObservation('${key}','${id}',this.value)">${h(x.observacion||'')}</textarea></td><td class="req-image-cell">${reqImageTools(key,id,x)}</td></tr>`;
 }).join('');
 box.innerHTML=`<div class="req-wrap"><table class="req-table"><thead><tr><th>Requisito</th><th class="req-check-head">Cumple</th><th class="req-check-head">No Cumple</th><th class="req-check-head">No Aplica</th><th>Observación para el usuario</th><th>Adjunto</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
window.setReqStatus=function(key,id,status,checked){const o=reqObj(key,id);o.estado=checked?status:'';saveLocal();renderRequirements();renderVista()}
window.updateReqObservation=function(key,id,value){const o=reqObj(key,id);o.observacion=String(value||'');saveLocal();renderVista()}
function readImage(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result||'');fr.onerror=()=>reject(fr.error||new Error('No se pudo leer la imagen.'));fr.readAsDataURL(file)})}
async function compressReqImage(file){const original=await readImage(file);return new Promise(resolve=>{const img=new Image();img.onload=()=>{try{let w=img.naturalWidth||img.width,hg=img.naturalHeight||img.height;const max=1200,scale=Math.min(1,max/Math.max(w,hg));const cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(hg*scale));const c=document.createElement('canvas');c.width=cw;c.height=ch;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,cw,ch);resolve(c.toDataURL('image/jpeg',.82))}catch(_){resolve(original)}};img.onerror=()=>resolve(original);img.src=original})}
window.addReqImages=async function(key,id,fileList){const o=reqObj(key,id),files=[...(fileList||[])].filter(f=>f?.type?.startsWith('image/')),loaded=[];for(const f of files){try{const d=await compressReqImage(f);if(d)loaded.push(d)}catch(e){console.warn(e)}}o.imagenes=[...new Set([...(o.imagenes||[]),...loaded])];o.imagen=o.imagenes[0]||'';saveLocal();renderRequirements();renderVista()}
window.pasteReqImages=function(key,id,event){const files=[...(event.clipboardData?.items||[])].filter(it=>it.kind==='file'&&it.type?.startsWith('image/')).map(it=>it.getAsFile()).filter(Boolean);if(files.length){event.preventDefault();addReqImages(key,id,files)}}

window.clearReqImages=function(key,id){const o=reqObj(key,id);o.imagenes=[];o.imagen='';saveLocal();renderRequirements();renderVista()}

function baseLegalObsHtml(){return `<p class="report-legal-title">Constitución de la República del Ecuador.</p><p><strong>Artículo 82.-</strong> El derecho a la seguridad jurídica se fundamenta en el respeto a la Constitución y en la existencia de normas jurídicas previas, claras, públicas y aplicadas por las autoridades competentes.</p><p><strong>Artículo 226.-</strong> Las instituciones del Estado, sus organismos, dependencias, las servidoras o servidores públicos y las personas que actúen en virtud de una potestad estatal ejercerán solamente las competencias y facultades que les sean atribuidas en la Constitución y la ley. Tendrán el deber de coordinar acciones para el cumplimiento de sus fines y hacer efectivo el goce y ejercicio de los derechos reconocidos en la Constitución.</p><p class="report-legal-title">Código Orgánico Administrativo.</p><p><strong>Artículo 140 dice:</strong> “Subsanaciones. Cuando alguno de los actos de la persona interesada no reúna los requisitos necesarios, la administración pública le notificará para que, en el término de diez días, subsane su omisión. La administración pública especificará los requisitos que deben ser enmendados por la persona interesada con la indicación de su fundamento legal, técnico o económico y las instrucciones detalladas del modo en que debe proceder para subsanar las deficiencias. Si la persona interesada no cumple lo dispuesto por la administración pública se entenderá como desistimiento y será declarado en la resolución. La administración pública no podrá disponer el archivo del procedimiento o la restitución de la petición a la persona interesada sin haber dispuesto la subsanación. Su omisión constituye una falta grave del servidor público y no suspende el procedimiento administrativo para todos los propósitos previstos en este Código.</p><p><strong>Artículo 183.-</strong> Iniciativa. El procedimiento administrativo puede iniciarse de oficio o a solicitud de la persona interesada. A solicitud de la persona interesada de la forma y con los requisitos previstos en este Código. De oficio, mediante decisión del órgano competente, bien por iniciativa propia o como consecuencia de orden superior, a petición razonada de otros órganos administrativos o por denuncia. Y demás en uso de las atribuciones contempladas en la Ordenanza 016-2023 que contiene el Código Urbano para el cantón Riobamba.</p>`}
function reportObservaciones(includeBackground=true){const obs=selectedObservations();const rows=obs.map((o,idx)=>`<tr><td class="nro-col">${idx+1}</td><td class="req-col">${h(o.requisito)}</td><td class="clar-col">${h(o.observacion||'')}</td></tr>${o.imagenes?.length?`<tr><td></td><td colspan="2"><div class="report-img-gallery">${o.imagenes.map((src,j)=>`<img src="${h(src)}" alt="Imagen ${j+1}">`).join('')}</div></td></tr>`:''}`).join('');const nota=clean(state.obsNota);const notaHtml=nota?`<div class="report-section-title"><span>4.</span><span>NOTA (opcional)</span></div><div class="report-note-box"><p>${h(nota)}</p></div>`:'';const conclusionN=nota?'5.':'4.';return `<div class="report-shell" id="printReport"><div class="report-content"><div class="report-section-title"><span>1.</span><span>ANTECEDENTES</span></div><p>${antecedenteObsHtml()}</p><div class="report-section-title"><span>2.</span><span>BASE LEGAL</span></div>${baseLegalObsHtml()}<div class="report-section-title"><span>3.</span><span>CRITERIO TÉCNICO</span></div>${obs.length?`<table class="report-table"><thead><tr><th class="nro-col">Nro.</th><th class="req-col">Requisito</th><th class="clar-col">Aclaración</th></tr></thead><tbody>${rows}</tbody></table>`:'<p>No se registran requisitos marcados como No Cumple.</p>'}${notaHtml}<div class="report-section-title"><span>${conclusionN}</span><span>CONCLUSIONES</span></div><p>Por las observaciones antes expuestas se emite Criterio Técnico <strong>NO FAVORABLE</strong>.</p><p>Con la documentación requerida presentarse hasta el día <strong>${h(fmt(state.info.fechaSubsanacion||''))}</strong>, (10 días hábiles) ingresada mediante ventanilla de atención ciudadana de manera digital y física.</p><p class="report-small-note">Para poder dar continuidad al trámite se deberá indicar la solvencia de las observaciones antes mencionadas en un plazo no mayor a 10 días laborables a partir de la presente notificación, caso contrario el trámite será devuelto en los términos descritos en la base legal de la presente notificación.<br>La documentación presentada debe ser ingresada mediante ventanilla de atención ciudadana de manera digital y física.<br>Cualquier consulta técnica a la presente notificación favor acercarse al departamento de Planificación, Hábitat y Desarrollo Urbanístico a las oficinas de Aprobación de planos.</p><div class="signature"><p><strong>Atentamente,</strong></p><div class="signature-space"></div><p><strong>${h(profile?.firma_nombre||profile?.nombre_completo||'')}</strong><br>${h(profile?.firma_cargo||profile?.cargo||'')}</p></div></div></div>`}

async function richCopy(html,plain){if(navigator.clipboard?.write&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain||html.replace(/<[^>]+>/g,' ')],{type:'text/plain'})})]);return}const d=document.createElement('div');d.contentEditable='true';d.style.position='fixed';d.style.left='-9999px';d.innerHTML=html;document.body.appendChild(d);const r=document.createRange();r.selectNodeContents(d);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();d.remove()}

async function init(){try{if(!await auth())return;const id=new URLSearchParams(location.search).get('solicitud');if(!id)throw new Error('No se recibió una solicitud estructural.');const {data,error}=await sb.from('phdu_solicitudes_revision_estructural').select('*').eq('id',id).single();if(error)throw error;request=data;if(request.estado_revision==='PENDIENTE'){await sb.from('phdu_solicitudes_revision_estructural').update({estado_revision:'EN_REVISION'}).eq('id',request.id);request.estado_revision='EN_REVISION'}initState();ensureStructObservationState();catalogs.menor=await loadCSV('data/checklist_estructural_hasta_2_pisos_400m2.csv');catalogs.mayor=await loadCSV('data/checklist_estructural_mas_2_pisos_400m2.csv');migrateOldReqObservationsStruct();$('estadoTop').value=request.estado_revision||'';$('ingenieroTop').value=profile.firma_nombre||profile.nombre_completo||profile.correo||'';renderInfo();syncSidebarStruct();renderStructCatalog();renderStructSelected();renderAprFields();$('obsNota').value=state.obsNota||'';$('desMotivo').value=state.des.motivo||'';$('desAsunto').value=state.des.asunto||'';$('desConclusiones').value=state.des.conclusiones||'';updateTabs();setStatus('Solicitud cargada correctamente.','ok');loadProfessionalEmailsStruct().then(()=>{const n=ensureNotificationStruct(),found=lookupProjectEmailStruct();if(found&&!n.correo){n.correo=found;n.correoAuto=found;n.correoManual=false;saveLocal();renderNotificationStruct()}}).catch(()=>{})}catch(e){setStatus(e.message||String(e),'error');console.error(e)}}
init();
